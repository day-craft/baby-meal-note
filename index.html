function openLogSheet(date){
  var e=entryForDate(date);
  var prev=normLog(state.logs[date]);
  var mpd=mealsPerDayOf(e);
  var planGrams=e?String(getEntryTargetGrams(e,date)||'').split('~')[0]:'';
  var shiftedAlready=!!(prev&&prev.shifted);
  var draft={am:null,pm:null};
  var touched={am:false,pm:false};
  if(prev&&prev.am) draft.am={amount:prev.am.amount,grams:prev.am.grams,reaction:prev.am.reaction,at:prev.am.at,saved:true};
  if(prev&&prev.pm) draft.pm={amount:prev.pm.amount,grams:prev.pm.grams,reaction:prev.pm.reaction,at:prev.pm.at,saved:true};
  /* 처음 열 때의 탭: 2식이면 아직 기록 없는 끼니부터 */
  var cur='am';
  if(mpd===2) cur=!draft.am?'am':(!draft.pm?'pm':'am');
  var openSlot=cur, switched=false;
  var shiftChoice=!shiftedAlready;
  var unshiftChoice=false;

  function slotStateText(k){
    var d=draft[k];
    if(!d) return '기록 없음';
    var skip=(d.amount==='skip');
    return (AMT_LABEL[d.amount]||'기록')+(!skip&&d.grams?' '+d.grams+'g':'');
  }
  function tabsHTML(){
    return SLOTS.map(function(s){
      return '<button type="button" data-slot="'+s.v+'" class="'+(cur===s.v?'on':'')+'">'+
        '<span class="st-l">'+s.l+' <em>('+s.n+')</em></span>'+
        '<span class="st-s">'+esc(slotStateText(s.v))+'</span></button>';
    }).join('');
  }
  function bodyHTML(){
    var d=draft[cur];
    var amt=d?d.amount:'full';
    var grams=d?d.grams:planGrams;
    var rx=d?d.reaction:'';
    var unshiftWrap='';
    if(shiftedAlready){
      unshiftWrap='<div class="hidden" id="unshiftExtra">'+
        '<label class="check" style="margin:10px 0 6px"><input type="checkbox" id="fUnshift"'+(unshiftChoice?' checked':'')+'> 미뤄 둔 이후 일정을 하루 앞으로 되돌리기</label>'+
        '<p class="sheet-note" style="margin:0 0 4px">이 날을 쉬어감으로 미뤘던 일정이 하루 당겨져요. 체크하지 않으면 일정은 그대로 둬요.</p>'+
      '</div>';
    }
    return '<div class="seg" id="amtSeg">'+AMOUNTS.map(function(a){
        return '<button type="button" data-amt="'+a.v+'" data-v="'+a.v+'" class="'+(a.v===amt?'on':'')+'">'+a.e+' '+a.l+'</button>';
      }).join('')+'</div>'+
      '<div class="hidden" id="skipExtra">'+
        '<p class="sheet-note" style="margin:10px 0 10px">아기 컨디션·외출 등으로 이 끼를 못 먹였으면 <b>쉬어감</b>. 섭취량은 0g으로 기록돼요.</p>'+
        '<label class="check" style="margin:0 0 8px"><input type="checkbox" id="fShift"'+(!shiftedAlready&&shiftChoice?' checked':'')+(shiftedAlready?' disabled':'')+'> '+
          (shiftedAlready?'이미 하루 미뤘어요 (다시 미루지 않아요)':'이후 일정 하루씩 뒤로 미루기')+'</label>'+
        '<p class="sheet-note" style="margin:0 0 4px">'+
          (shiftedAlready?'이 날짜는 이미 한 번 미뤘어요. 같은 일정이 두 번 밀리지 않도록 미루기는 꺼 두었어요.'
            :'오전·오후 <b>모두</b> 쉬어감일 때만 이후 일정이 하루 밀려요. 한 끼만 건너뛰면 일정은 그대로예요.')+'</p>'+
      '</div>'+unshiftWrap+
      '<label class="field" style="margin-top:16px">실제로 먹은 양 (g)<input id="fGrams" type="number" inputmode="numeric" step="1" min="0" max="400" data-def="'+esc(planGrams)+'" data-shifted="'+(shiftedAlready?'1':'0')+'" value="'+esc(grams)+'"></label>'+
      '<label class="field">반응 · 메모<textarea id="fReaction" rows="3" placeholder="예: 끝까지 잘 먹음. 입가 발진 없음">'+esc(rx)+'</textarea></label>'+
      '<div class="rx-chips" id="rxChips">'+rxChipsHTML(rx)+'</div>'+
      (d?'<button type="button" class="btn btn-ghost btn-block slotclear" id="slotClear">이 끼니('+slotLabel(cur)+') 기록 지우기</button>':'');
  }

  var body='<form id="logForm" novalidate>'+
    '<p class="sheet-note">'+mdLong(date)+' ('+dowOf(date)+') · '+esc(e?e.menu:'직접 기록')+'</p>'+
    '<div class="slottabs" id="slotTabs">'+tabsHTML()+'</div>'+
    '<div id="slotBody">'+bodyHTML()+'</div>'+
    '<div class="sheet-actions">'+
      '<button type="button" class="btn btn-ghost" data-act="close-sheet">취소</button>'+
      '<button type="submit" class="btn btn-primary">저장</button>'+
    '</div>'+
    (prev?'<button type="button" class="btn btn-danger btn-block" style="margin-top:8px" data-act="log-del" data-date="'+date+'">이 날 기록 모두 지우기</button>':'')+
  '</form>';

  openSheet({title:'먹인 기록', body:body, onMount:function(root){
    var tabs=root.querySelector('#slotTabs');
    var bodyEl=root.querySelector('#slotBody');
    function capture(){
      var on=bodyEl.querySelector('#amtSeg .on');
      if(!on) return;
      var amt=on.getAttribute('data-amt')||'full';
      var gEl=bodyEl.querySelector('#fGrams');
      var rEl=bodyEl.querySelector('#fReaction');
      var g=(gEl?gEl.value:'').trim();
      var rx=(rEl?rEl.value:'').trim();
      draft[cur]={amount:AMT_LABEL[amt]?amt:'full', grams:(amt==='skip'?'0':g), reaction:rx,
        at:(draft[cur]&&draft[cur].at)||null, saved:!!(draft[cur]&&draft[cur].saved)};
      var sc=bodyEl.querySelector('#fShift');
      if(sc&&!sc.disabled) shiftChoice=!!sc.checked;
      var uc=bodyEl.querySelector('#fUnshift');
      if(uc) unshiftChoice=!!uc.checked;
    }
    function paint(){
      tabs.innerHTML=tabsHTML();
      bodyEl.innerHTML=bodyHTML();
      syncAmtSkip(root);
    }
    bodyEl.addEventListener('input', function(ev){
      touched[cur]=true;
      if(ev.target&&ev.target.id==='fReaction'){
        var rc=bodyEl.querySelector('#rxChips');
        if(rc) rc.innerHTML=rxChipsHTML(ev.target.value);
      }
    });
    bodyEl.addEventListener('click', function(ev){
      var rxb=ev.target.closest?ev.target.closest('[data-rx]'):null;
      if(rxb){
        var ta=bodyEl.querySelector('#fReaction');
        if(ta){
          ta.value=rxToggle(ta.value, rxb.getAttribute('data-rx'));
          var rc2=bodyEl.querySelector('#rxChips');
          if(rc2) rc2.innerHTML=rxChipsHTML(ta.value);
        }
        touched[cur]=true;
        return;
      }
      var cl=ev.target.closest?ev.target.closest('#slotClear'):null;
      if(cl){
        draft[cur]=null; touched[cur]=false;
        paint();
        toast(slotLabel(cur)+' 기록을 지웠어요 · 저장을 눌러 반영해요');
        return;
      }
      if(ev.target.closest&&ev.target.closest('#amtSeg')) touched[cur]=true;
    });
    tabs.addEventListener('click', function(ev){
      var b=ev.target.closest?ev.target.closest('[data-slot]'):null;
      if(!b) return;
      var k=b.getAttribute('data-slot');
      if(k===cur) return;
      capture();
      cur=k;
      switched=true;
      paint();
    });
    syncAmtSkip(root);
    root.querySelector('#logForm').addEventListener('submit', function(ev){
      ev.preventDefault();
      capture();
      var now=new Date().toISOString();
      function buildSlot(k){
        var d=draft[k];
        if(!d) return null;
        /* 저장된 적도 없고 손대지도 않은 슬롯은 만들지 않음.
           다만 시트를 열자마자 보이던 끼니는 그대로 저장을 누르면 예전처럼 기본값으로 기록 */
        if(!d.saved&&!touched[k]&&!(k===openSlot&&!switched)) return null;
        return {
          amount:AMT_LABEL[d.amount]?d.amount:'full',
          grams:(d.amount==='skip'?'0':(d.grams==null?'':String(d.grams))),
          reaction:d.reaction?String(d.reaction):'',
          at:d.at||now
        };
      }
      var am=buildSlot('am'), pm=buildSlot('pm');
      var prevHadEaten=logHasEaten(state.logs[date]);
      var prevSlotCount=logSlots(state.logs[date]).length;
      if(!am&&!pm){
        var had=!!state.logs[date];
        if(had) delete state.logs[date];
        var backDel=(had&&shiftedAlready)?unshiftScheduleFrom(date):0;
        save(); closeSheet(); render();
        toast(backDel?'기록을 지우고 일정 '+backDel+'개를 하루 당겼어요':(had?'이 날 기록을 지웠어요':'저장할 기록이 없어서 그대로 뒀어요'));
        return;
      }
      var daySkipped=(function(){
        var sl=[am,pm].filter(Boolean);
        if(!sl.length) return false;
        /* 2식은 오전·오후 둘 다 쉬어감일 때만 '하루 쉬어감'으로 보고 일정을 밀어요 */
        if(mpd===2) return !!(am&&pm&&am.amount==='skip'&&pm.amount==='skip');
        return sl.every(function(s){ return s.amount==='skip'; });
      })();
      var doShift=!!(daySkipped&&!shiftedAlready&&shiftChoice);
      var doUnshift=!!(!daySkipped&&shiftedAlready&&unshiftChoice);
      var rec={am:am, pm:pm, shifted:(daySkipped?(shiftedAlready||doShift):(shiftedAlready&&!doUnshift)), at:now};
      state.logs[date]=rec;
      var moved=0, back=0;
      if(doShift) moved=shiftScheduleFrom(date);
      if(doUnshift) back=unshiftScheduleFrom(date);
      var notes=[];
      if(e){
        var res=autoOpenLinkedPacks(e,date);
        if(res&&res.opened.length) notes.push('🌱 '+res.opened.join(' · ')+' 개봉 표시');
        else if(res&&res.first&&res.expected.length) notes.push('도착 예정 팩은 도착 처리하면 이어져요');
      }
      var ingStarted=autoIngOnLog(date);
      if(ingStarted.length) notes.push('🌱 '+ingStarted.join('·')+' 관찰 시작');
      save(); closeSheet(); render();
      var baseMsg;
      if(daySkipped) baseMsg=moved?('쉬어감으로 표시하고 일정 '+moved+'개를 하루 미뤘어요'):(shiftedAlready?'쉬어감으로 표시했어요 (일정은 그대로)':'쉬어감으로 표시했어요');
      else if(back) baseMsg='기록을 고치고 일정 '+back+'개를 하루 당겼어요';
      else baseMsg=(am&&pm)?'오전·오후 기록을 저장했어요':'기록을 저장했어요';
      toast(notes.length?baseMsg+' · '+notes.join(' · '):baseMsg);
      /* 마지막 계획일에 먹인 기록 → 연결된 팩 수량 차감 확인
         (그 날 첫 기록이거나, 1끼만 있던 날에 두 번째 끼를 마저 기록할 때) */
      var newSlotCount=[am,pm].filter(Boolean).length;
      if(e&&date===e.end&&logHasEaten(rec)&&(!prevHadEaten||(prevSlotCount===1&&newSlotCount===2&&mpd===2))){
        var cand=consumeCandidate(e);
        if(cand) askConsumePack(cand);
      }
    });
  }});
}

/* 연결된 팩이 있는 식단의 '첫 먹인 기록'을 저장하면 그 팩을 기록 날짜로 자동 개봉.
   도착 예정(expected) 팩은 건드리지 않고 안내만 해요. */
function autoOpenLinkedPacks(e,date){
  var packs=packsOf(e);
  if(!packs.length) return null;
  var first=null, d=e.start;
  while(d<=e.end){
    if(logHasEaten(state.logs[d])){ first=d; break; }
    d=addDays(d,1);
  }
  var isFirst=(first===date);
  var openedNames=[], expectedNames=[];
  packs.forEach(function(s){
    if(s.status==='expected'){ expectedNames.push(s.name); return; }
    if(isFirst&&s.status==='arrived'&&!s.opened&&s.qty>0){ s.opened=date; openedNames.push(s.name); }
  });
  return {first:isFirst, opened:openedNames, expected:expectedNames};
}
/* 마지막 계획일에 수량을 줄일 팩: 개봉된 팩 우선, 그다음 도착해 있는 팩 */
function consumeCandidate(e){
  var packs=packsOf(e).filter(function(s){ return s.status==='arrived'&&s.qty>=1; });
  if(!packs.length) return null;
  var opened=packs.filter(function(s){ return !!s.opened; });
  return opened.length?opened[0]:packs[0];
}
function askConsumePack(s){
  var after=s.qty-1;
  hideToast();
  openSheet({
    title:'재고 차감',
    body:'<p class="sheet-note" style="font-weight:700;color:#BF5C42">이 식단의 연결된 팩을 다 먹었나요? 재고 수량을 1개 줄일까요?</p>'+
      '<p class="sheet-note">'+esc(s.name)+' · '+s.qty+'팩 → <b>'+after+'팩</b>'+(after<=0?' (소진 완료)':'')+'</p>'+
      '<p class="sheet-note">줄이지 않으면 재고는 그대로 두고 먹인 기록만 남겨요.</p>'+
      '<div class="sheet-actions">'+
        '<button type="button" class="btn btn-ghost" data-act="close-sheet">그대로 두기</button>'+
        '<button type="button" class="btn btn-primary" id="consumeYes">1개 줄이기</button>'+
      '</div>',
    onMount:function(root){
      root.querySelector('#consumeYes').addEventListener('click', function(){
        s.qty=Math.max(0,s.qty-1);
        if(s.qty<=0) s.opened='';
        save(); closeSheet(); render();
        toast(s.qty<=0?('재고 1팩 줄임 · '+s.name+' 소진 완료'):'재고를 1팩 줄였어요');
      });
    }
  });
}

function packPickHTML(e){
  var chosen=packIdsOf(e);
  if(!state.stock.length){
    return '<p class="sheet-note" style="margin:0 0 14px">냉장·재고 탭에 팩을 먼저 추가하면 여기서 연결할 수 있어요.</p>';
  }
  var list=state.stock.slice().sort(function(a,b){
    if(a.status!==b.status) return a.status==='arrived'?-1:1;
    return String(a.expected||a.arrived||'').localeCompare(String(b.expected||b.arrived||''));
  });
  return '<div class="packpick" id="packPick">'+list.map(function(s){
    var on=chosen.indexOf(s.id)>=0;
    var sub;
    if(s.status==='expected') sub='도착 예정'+(s.expected?' '+mdShort(s.expected):'');
    else sub=(s.opened?'개봉 '+mdShort(s.opened):'냉장')+' · '+s.qty+'팩';
    var used=state.entries.filter(function(x){ return (!e||x.id!==e.id)&&packIdsOf(x).indexOf(s.id)>=0; });
    if(used.length) sub='사용 중 '+mdShort(used[0].start)+'~'+mdShort(used[0].end);
    return '<label class="packchip'+(on?' on':'')+(s.status==='expected'?' expected':'')+'">'+
      '<input type="checkbox" data-pack="'+esc(s.id)+'"'+(on?' checked':'')+'>'+
      '<span>'+esc(s.name)+' <span style="color:#B3A597;font-weight:700">'+s.size+'g</span></span>'+
      '<span class="pk-sub">'+esc(sub)+'</span></label>';
  }).join('')+'</div>';
}

    var mpd=mealsPerDayOf(e);
    var mealSeg=root.querySelector('#mealSeg');

      if(hint) hint.textContent=(mpd===2?'오전·오후 두 끼를 따로 기록해요. 1회 양은 한 끼 기준이에요.':'하루 한 끼 기록이에요. 필요하면 기록할 때 오후 끼를 더할 수 있어요.');
    });
    /* 연결할 재고 팩 여러 개 */
    var packWrap=root.querySelector('#packPick');
    if(packWrap) packWrap.addEventListener('change', function(ev){
      var inp=ev.target;
      if(!inp||!inp.getAttribute||!inp.getAttribute('data-pack')) return;
      var lab=inp.closest?inp.closest('.packchip'):null;
      if(lab) lab.classList.toggle('on', !!inp.checked);
    });
    /* ── 날짜별 목표 용량(dailyGrams) ── */
    var dgBox=root.querySelector('#dgBox');
    var dgRows=root.querySelector('#dgRows');
    var dgHint=root.querySelector('#dgHint');
    var dgFoot=root.querySelector('#dgFoot');
    var fDaily=root.querySelector('#fDaily');
    var dgEdits={};                       /* { 'YYYY-MM-DD': '55' } 손댄 날짜만 */

    var dgStartWatch=start;
    function dgValidRange(){
      var sEl=root.querySelector('#fStart'), eEl=root.querySelector('#fEnd');
      var sv=sEl?sEl.value:'', ev=eEl?eEl.value:'';
      if(!isDate(sv)||!isDate(ev)||ev<sv) return null;
      return {s:sv, e:ev};
    }
    function dgBase(){
      var gEl=root.querySelector('#fGrams');
      return gramsBaseNum(gEl?gEl.value:'');
    }
    function dgFootText(count){
      var base=dgBase();
      if(!count) return base==null?'아직 바꾼 날이 없어요. 비워 두면 기본 1회 양을 써요.':'아직 바꾼 날이 없어요 — 모든 날 기본 '+base+'g';
      return '이 중 '+count+'일은 기본과 다른 용량이에요'+(base==null?'':' (기본 '+base+'g)');
    }
    function dgRenderRows(){
      if(!dgRows||!fDaily||!fDaily.checked) return;
      var rg=dgValidRange();
      if(!rg){
        dgRows.innerHTML='<p class="dg-foot" style="margin:2px 0 6px">시작일과 마지막 날을 먼저 정해 주세요.</p>';
        if(dgFoot) dgFoot.textContent=dgFootText(0);
        return;
      }
      var base=dgBase(), html='', cnt=0, d=rg.s, n=0;
      while(d<=rg.e&&n<120){
        var has=Object.prototype.hasOwnProperty.call(dgEdits,d);
        var raw=has?String(dgEdits[d]):'';
        var v=raw!==''?raw:(base==null?'':String(base));
        var isDiff=(raw!==''&&(base==null||Number(raw)!==base));
        if(isDiff) cnt++;
        html+='<label class="dg-row">'+
          '<span class="dg-date">'+mdShort(d)+' ('+dowOf(d)+')</span>'+
          '<input type="text" inputmode="numeric" autocomplete="off" data-date="'+d+'" value="'+esc(v)+'"'+
            (base==null?'':' placeholder="'+esc(String(base))+'"')+(isDiff?' class="diff"':'')+'>'+
          '<span class="dg-unit">g</span></label>';
        d=addDays(d,1); n++;
      }
      dgRows.innerHTML=html;
      if(dgFoot) dgFoot.textContent=dgFootText(cnt);
    }
    function dgSync(){
      if(!dgBox||!fDaily) return;
      var on=!!fDaily.checked;
      dgBox.classList.toggle('on', on);
      if(dgRows) dgRows.classList.toggle('hidden', !on);
      if(dgFoot) dgFoot.classList.toggle('hidden', !on);
      if(dgHint){
        dgHint.textContent=on
          ? '바꾸고 싶은 날만 고치면 돼요. 비워 두는 날은 기본 1회 양을 써요.'
          : '체크하면 날짜마다 다른 목표 용량을 넣을 수 있어요.';
      }
      if(on) dgRenderRows();
    }
    if(fDaily) fDaily.addEventListener('change', dgSync);
    if(dgRows) dgRows.addEventListener('input', function(ev){
      var inp=ev.target;
      if(!inp||!inp.getAttribute||!inp.getAttribute('data-date')) return;
      var d=inp.getAttribute('data-date');
      var v=String(inp.value||'').trim();
      if(v===''){ delete dgEdits[d]; } else { dgEdits[d]=v; }
      var base=dgBase();
      inp.classList.toggle('diff', (v!==''&&(base==null||Number(v)!==base)));
      if(dgFoot) dgFoot.textContent=dgFootText(dgRows.querySelectorAll('input.diff').length);
    });
    var dgGramsField=root.querySelector('#fGrams');
    if(dgGramsField) dgGramsField.addEventListener('input', function(){ if(fDaily&&fDaily.checked) dgRenderRows(); });
    ['#fStart','#fEnd'].forEach(function(sel){
      var el=root.querySelector(sel);
      if(!el) return;
      el.addEventListener('input', function(){
        /* 시작일을 옮기면 날짜별 용량도 같은 날짜에 붙어 따라가게 합니다 */
        if(sel==='#fStart'&&isDate(el.value)&&isDate(dgStartWatch)&&el.value!==dgStartWatch){
          var dl=diffDays(dgStartWatch,el.value);
          if(dl) dgEdits=remapKeyMap(dgEdits,dl);
          dgStartWatch=el.value;
        }
        if(fDaily&&fDaily.checked) dgRenderRows();
      });
    });
    dgSync();
    function laterList(){
      if(!e) return [];
      return state.entries.filter(function(x){ return x.id!==e.id&&x.start>e.end; });
    }
    function syncFollow(){
      if(!e||!fWrap||!fBox) return;
      var enEl=root.querySelector('#fEnd');
      var endV=enEl?enEl.value:'';
      var delta=isDate(endV)?diffDays(e.end,endV):0;
      var later=laterList();
      if(!later.length||delta===0){ fWrap.classList.add('hidden'); if(fNote) fNote.classList.add('hidden'); return; }
      fWrap.classList.remove('hidden');
      if(fNote) fNote.classList.remove('hidden');
      fBox.disabled=false;
      if(!fTouched) fBox.checked=(delta<0);
      var isPull=(delta<0);
      if(fLabel) fLabel.textContent='이후 일정 '+later.length+'개를 '+Math.abs(delta)+'일 '+(isPull?'앞으로 당기기':'뒤로 밀기');
      if(fNote) fNote.textContent=isPull?'빈 날짜가 생기지 않게 뒤 일정이 당겨져요.':'';
    }
    if(e&&fBox){
      fBox.addEventListener('change', function(){ fTouched=true; });
      ['#fStart','#fEnd'].forEach(function(sel){
        var el=root.querySelector(sel);
        if(el){ el.addEventListener('change', syncFollow); el.addEventListener('input', syncFollow); }
      });
      syncFollow();
    }
    function showErr(msg){
      var el=root.querySelector('#entryErr');
      if(!el) return;
      if(!msg){ el.classList.add('hidden'); el.textContent=''; return; }
      el.textContent=msg;
      el.classList.remove('hidden');
    }
    function laterWillFollow(delta){
      return !!(delta!==0&&fBox&&!fBox.disabled&&fBox.checked&&laterList().length);
    }
    root.querySelector('#entryForm').addEventListener('submit', function(ev){
      ev.preventDefault();
      var menu=(root.querySelector('#fMenu').value||'').trim();
      var s=root.querySelector('#fStart').value;
      var en=root.querySelector('#fEnd').value;
      if(!menu){ toast('메뉴 이름을 적어 주세요'); return; }
      if(!isDate(s)||!isDate(en)){ toast('날짜를 확인해 주세요'); return; }
      if(en<s){ var tmp=s; s=en; en=tmp; }
      var pids=[];
      if(packWrap){
        Array.prototype.forEach.call(packWrap.querySelectorAll('input[data-pack]'), function(inp){
          if(inp.checked) pids.push(inp.getAttribute('data-pack'));
        });
      }
      /* 날짜별 목표 용량: 체크한 경우에만, 기본 1회 양과 다른 날만 저장 */
      var dgOut=null;
      if(fDaily&&fDaily.checked){
        var rg=dgValidRange();
        if(!rg){ toast('시작일과 마지막 날을 확인해 주세요'); return; }
        var base=gramsBaseNum((root.querySelector('#fGrams').value||''));
        var tmp={}, bad='', dd=rg.s;
        while(dd<=rg.e){
          var inEl=root.querySelector('#dgRows input[data-date="'+dd+'"]');
          var raw=inEl?String(inEl.value||'').trim():'';
          if(raw!==''){
            var nv=Number(raw);
            if(!isFinite(nv)||nv<0||nv>MAX_GRAMS){ bad=dd; }
            else {
              nv=Math.round(nv);
              if(!(base!=null&&nv===base)) tmp[dd]=nv;
            }
          }
          dd=addDays(dd,1);
        }
        if(bad){ showErr(mdShort(bad)+' 용량은 0~'+MAX_GRAMS+' 사이 숫자로 적어 주세요.'); toast('날짜별 용량을 확인해 주세요'); return; }
        if(Object.keys(tmp).length) dgOut=tmp;
      }
      var rec={
        id:e?e.id:uid('e'),
        start:s, end:en, menu:menu,
        brand:(root.querySelector('#fBrand').value||'').trim(),
        short:((root.querySelector('#fShort').value||'').trim()||menu.replace(/\s*(미음|죽)$/,'').slice(-3)),
        grams:(root.querySelector('#fGrams').value||'').trim(),
        note:(root.querySelector('#fNote').value||'').trim(),
        mealsPerDay:mpd,
        packId:(pids[0]||null), packIds:pids
      };
      if(dgOut) rec.dailyGrams=dgOut;
      var oldEnd=e?e.end:'';
      var delta=e?diffDays(oldEnd,en):0;
      var follow=e?laterWillFollow(delta):false;
      /* 저장될 결과를 먼저 만들어 겹침을 검사 (시작일만 바꾼 경우도 포함) */
      var next=state.entries.filter(function(x){ return x.id!==rec.id; }).map(cloneEntry);
      next.push(cloneEntry(rec));
      var moved=0;
      if(follow){
        next.forEach(function(x){
          if(x.id===rec.id) return;
          if(x.start>oldEnd){
            var from=x.start;
            x.start=addDays(x.start,delta); x.end=addDays(x.end,delta);
            shiftDailyGrams(x,from,delta);
            moved++;
          }
        });
      }
      var hits=overlapHits(next, rec.id);
      if(hits.length){
        var names=hits.map(function(x){ return '"'+x.menu+'" '+mdShort(x.start)+'~'+mdShort(x.end); }).join(', ');
        var msg='다른 일정과 날짜가 겹쳐요: '+names;
        if(e&&delta!==0&&fBox&&!fBox.disabled&&!fBox.checked) msg+='\n"'+fLabel.textContent+'"를 켜거나 날짜를 조정해 주세요.';
        else msg+='\n날짜를 조정해 주세요.';
        showErr(msg);
        toast('다른 일정과 날짜가 겹쳐요');
        return;
      }
      showErr('');
      state.entries=next.sort(function(a,b){ return a.start<b.start?-1:(a.start>b.start?1:0); });
      if(follow&&delta) remapLogs(function(k){ return k>oldEnd?addDays(k,delta):k; });
      save(); closeSheet(); render();
      if(!e) toast('일정을 추가했어요');
      else if(moved) toast('일정을 고치고 뒤 일정 '+moved+'개를 '+Math.abs(delta)+'일 '+(delta<0?'당겼어요':'밀었어요'));
      else toast('일정을 고쳤어요');
    });
  }});
}

/* ═════ 서명·3-way 병합 도우미 ═════
   화면 보기 설정(ui)과 저장 시각은 빼고 '기록 데이터'만 비교/병합합니니다. */
function byIdAsc(a,b){ var x=String((a&&a.id)||''), y=String((b&&b.id)||''); return x<y?-1:(x>y?1:0); }
function syncData(s){
  s=(s&&typeof s==='object')?s:{};
  var logs={};
  try{ Object.keys(s.logs||{}).sort().forEach(function(k){ logs[k]=s.logs[k]; }); }catch(e){}
  return {
    profile:s.profile||{},
    principles:s.principles||{},
    entries:(Array.isArray(s.entries)?s.entries.slice():[]).sort(byIdAsc),
    logs:logs,
    stock:(Array.isArray(s.stock)?s.stock.slice():[]).sort(byIdAsc),
    ingredients:(Array.isArray(s.ingredients)?s.ingredients.slice():[]).sort(byIdAsc),
    brands:(Array.isArray(s.brands)?s.brands.slice():[]).sort(byIdAsc)
  };
}
function syncSig(s){
  try{ return JSON.stringify(syncData(s)); }catch(e){ return ''; }
}
function jstr(v){ try{ return JSON.stringify(v===undefined?null:v); }catch(e){ return ''; } }

/* id 목록 병합: base(마지막 동기화 상태) 기준으로 한쪽만 바뀐 것은 그쪽을,
   둘 다 바뀐 것은 이 폰 기록을 살립니다. 삭제도 그대로 전파됩니다. */
function mergeListBy(baseArr,localArr,cloudArr){
  var b={},l={},c={},order=[];
  function idx(arr,map){ (arr||[]).forEach(function(it){ if(it&&it.id&&!map[String(it.id)]) map[String(it.id)]=it; }); }
  idx(baseArr,b); idx(localArr,l); idx(cloudArr,c);
  (localArr||[]).forEach(function(it){ if(it&&it.id){ var k=String(it.id); if(order.indexOf(k)<0) order.push(k); } });
  (cloudArr||[]).forEach(function(it){ if(it&&it.id){ var k=String(it.id); if(order.indexOf(k)<0) order.push(k); } });
  var out=[], conflicts=0;
  order.forEach(function(k){
    var bi=b[k], li=l[k], ci=c[k];
    var bj=bi?jstr(bi):null, lj=li?jstr(li):null, cj=ci?jstr(ci):null;
    var pick=null;
    if(li&&ci){
      if(lj===cj) pick=li;
      else if(lj===bj) pick=ci;            /* 클라우드에서만 바꿈 */
      else if(cj===bj) pick=li;            /* 이 폰에서만 바꿈 */
      else { pick=li; conflicts++; }       /* 둘 다 바꿈 → 이 폰 우선 보존 */
    } else if(li){
      if(!(bi&&lj===bj)) pick=li;          /* 클라우드에서 지운 항목은 지움 */
    } else if(ci){
      if(!(bi&&cj===bj)) pick=ci;          /* 이 폰에서 지운 항목은 지움 */
    }
    if(pick) out.push(pick);
  });
  return {list:out,conflicts:conflicts};
}
/* 한 날짜·한 항목 병합 규칙: base(마지막 동기화 상태) 대비 한쪽만 바뀐 쪽을 쓰고,
   둘 다 바뀌었으면 이 폰 기록을 살립니다. */
function pickUnit(b,l,c){
  var bj=b?jstr(b):null, lj=l?jstr(l):null, cj=c?jstr(c):null;
  if(l&&c){
    if(lj===cj) return {v:l};
    if(lj===bj) return {v:c};
    if(cj===bj) return {v:l};
    return {v:l,conflict:true};
  }
  if(l){ return (b&&lj===bj)?{v:null}:{v:l}; }
  if(c){ return (b&&cj===bj)?{v:null}:{v:c}; }
  return {v:null};
}
function mergeFlag(bv,lv,cv){
  var bj=jstr(bv), lj=jstr(lv), cj=jstr(cv);
  if(lj===cj) return lv===true;
  if(lj===bj) return cv===true;
  return lv===true;
}
/* 날짜별 먹인 기록(logs) 병합: 오전/오후 슬롯을 따로 비교해서
   한쪽 폰은 오전, 다른 폰은 오후를 기록한 경우에도 둘 다 살립니다. */
function mergeLogsBy(baseMap,localMap,cloudMap){
  var b=baseMap||{}, l=localMap||{}, c=cloudMap||{}, keys=[];
  Object.keys(l).forEach(function(k){ if(keys.indexOf(k)<0) keys.push(k); });
  Object.keys(c).forEach(function(k){ if(keys.indexOf(k)<0) keys.push(k); });
  keys.sort();
  var out={}, conflicts=0;
  keys.forEach(function(k){
    var bi=b[k]||null, li=l[k]||null, ci=c[k]||null;
    if(!li||!ci){
      var w=pickUnit(bi,li,ci);
      if(w.v) out[k]=w.v;
      if(w.conflict) conflicts++;
      return;
    }
    var bN=normLog(bi), lN=normLog(li), cN=normLog(ci);
    if(!lN||!cN){ out[k]=li; return; }
    var am=pickUnit(bN?bN.am:null,lN.am,cN.am);
    var pm=pickUnit(bN?bN.pm:null,lN.pm,cN.pm);
    if(am.conflict||pm.conflict) conflicts++;
    if(!am.v&&!pm.v) return;                 /* 한쪽에서 지운 기록 → 지움 */
    var at=null;
    [am.v,pm.v].forEach(function(sv){ if(sv&&sv.at&&(!at||String(sv.at)>String(at))) at=sv.at; });
    if(!at) at=(lN.at||cN.at||null);
    out[k]={am:am.v, pm:pm.v, shifted:mergeFlag(bN?bN.shifted:null,lN.shifted,cN.shifted), at:at};
  });
  return {map:out,conflicts:conflicts};
}
/* 프로필·원칙처럼 통짜로 비교하는 묶음 */
function mergeUnit(b,l,c){
  var bj=jstr(b), lj=jstr(l), cj=jstr(c);
  if(lj===cj) return l;
  if(lj===bj) return c;
  if(cj===bj) return l;
  return l;   /* 둘 다 바뀜 → 이 폰 우선 */
}
/* base(없을 수 있음) · 이 폰 · 클라우드를 합쳐 하나의 기록으로 */
function mergeStates(base,local,cloud){
  var b=syncData(base?normalize(base):null), l=syncData(local), c=syncData(cloud);
  var e=mergeListBy(b.entries,l.entries,c.entries);
  var s=mergeListBy(b.stock,l.stock,c.stock);
  var g=mergeListBy(b.ingredients,l.ingredients,c.ingredients);
  var br=mergeListBy(b.brands,l.brands,c.brands);
  var lg=mergeLogsBy(b.logs,l.logs,c.logs);
  var out={
    version:1,
    profile:mergeUnit(b.profile,l.profile,c.profile),
    principles:mergeUnit(b.principles,l.principles,c.principles),
    entries:e.list.sort(function(x,y){ return x.start<y.start?-1:(x.start>y.start?1:0); }),
    logs:lg.map,
    stock:s.list,
    ingredients:g.list,
    brands:br.list,
    ui:(local&&local.ui)||null,
    savedAt:(local&&local.savedAt)||null
  };
  out.conflicts=e.conflicts+s.conflicts+g.conflicts+br.conflicts+lg.conflicts;
  return out;
}
/* 이 폰에 아직 새 기록이 없을 때(시드와 동일) */
var seedSigCache=null;
function seedSig(){ if(!seedSigCache) seedSigCache=syncSig(normalize(seedState())); return seedSigCache; }
function isSeedLike(s){ try{ return syncSig(s)===seedSig(); }catch(e){ return false; } }

/* ── Firebase SDK: 필요한 순간에만, 실패해도 앱은 그대로 ── */
function fbReady(){ return !!(window.firebase&&window.firebase.firestore&&window.firebase.apps); }
function loadFirebase(cb){
  if(fbReady()){ try{ cb(null); }catch(e){} return; }
  fbSdk.cbs.push(cb);
  if(fbSdk.loading) return;
  fbSdk.loading=true;
  var settled=false, timer=null;
  function finish(err){
    if(settled) return;
    settled=true;
    if(timer) clearTimeout(timer);
    fbSdk.loading=false;
    var list=fbSdk.cbs.slice();
    fbSdk.cbs.length=0;
    for(var i=0;i<list.length;i++){ try{ list[i](err||null); }catch(e){} }
  }
  function add(src,next){
    var s=document.createElement('script');
    s.src=src; s.async=true;
    s.onload=function(){ next(null); };
    s.onerror=function(){ next(new Error('불러오지 못했어요')); };
    document.head.appendChild(s);
  }
  timer=setTimeout(function(){ finish(new Error('시간 초과')); },10000);
  add('https://www.gstatic.com/firebasejs/'+FB_VER+'/firebase-app-compat.js',function(e1){
    if(e1){ finish(e1); return; }
    add('https://www.gstatic.com/firebasejs/'+FB_VER+'/firebase-firestore-compat.js',function(e2){
      if(e2){ finish(e2); return; }
      finish(fbReady()?null:new Error('SDK를 시작하지 못했어요'));
    });
  });
}
function cloudDb(){
  try{
    if(!fbReady()) return null;
    if(!firebase.apps.length) firebase.initializeApp(CLOUD_CFG);
    return firebase.firestore();
  }catch(e){ return null; }
}
function cloudDocRef(db,code){
  try{ return db.collection('notes').doc(code+SYNC_SUFFIX); }catch(e){ return null; }
}

/* ── 올리기 ──
   · 문서를 통째로 덮어쓰지 않고, 트랜잭션 안에서 최신본을 읽어 3-way 병합한 뒤 씁니다.
     (오프라인 중 예약된 예전 내용이 다른 기기의 새 기록을 지우는 일을 막음) */
function doPush(manual){
  if(sync.status!=='on'||!sync.doc) return false;
  if(sync.pushTimer){ clearTimeout(sync.pushTimer); sync.pushTimer=null; }
  var db=sync.db, ref=sync.doc;
  if(!db) return false;
  var seq=++sync.pushSeq;
  var from=null, to=null, pushed=null;

  function txBody(tx){
    return tx.get(ref).then(function(snap){
      var remote=null;
      if(snap&&snap.exists){
        var d=snap.data()||{};
        if(d.updatedBy!==sync.deviceId){
          try{ remote=normalize(JSON.parse(String(d.payload||'null'))); }catch(e){ remote=null; }
        }
      }
      var next=state;
      if(remote&&syncSig(remote)!==syncSig(state)){
        var m=mergeStates(sync.base,state,remote);
        var conflicts=m.conflicts||0;
        delete m.conflicts;
        m.ui=state.ui;
        if(syncSig(m)!==syncSig(state)){ next=m; if(conflicts) pendingMergeToast=true; }
      }
      from=state; to=next;
      var body;
      try{ body=JSON.stringify(syncData(next)); }catch(e){ throw e; }
      pushed=body;
      tx.set(ref,{
        payload:body,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy:sync.deviceId
      });
    });
  }
  try{
    db.runTransaction(txBody).then(function(){
      if(seq!==sync.pushSeq) return;
      sync.lastPush=new Date().toISOString();
      /* 병합된 상대 내용을 이 폰에도 반영 (그 사이 로컬이 또 바뀌지 않았을 때만) */
      try{
        if(to&&from&&syncSig(state)===syncSig(from)&&syncSig(to)!==syncSig(from)){
          state=to; saveLocal(true); render();
        }
      }catch(e){}
      var now=null;
      try{ now=JSON.stringify(syncData(state)); }catch(e){}
      if(now===pushed){
        sync.dirty=false;
        setBase(state);
        writeSyncMeta(sync.code);
      } else {
        cloudPush();                     /* 올리는 사이 또 바뀜 → 한 번 더 */
      }
      sync.err='';
      if(pendingMergeToast){ pendingMergeToast=false; toast('☁️ 다른 기기 기록을 합쳐서 올렸어요'); }
      else if(manual) toast('☁️ 클라우드에 올렸어요 · '+fmtClock(sync.lastPush));
      paintCloud();
    },function(err){
      var code=(err&&err.code)?String(err.code):'';
      sync.err=(code.indexOf('permission-denied')>=0)?'보안 규칙에 막혀 올리지 못했어요':((err&&err.message)?err.message:'클라우드에 올리지 못했어요');
      paintCloud();
      if(manual) toast('☁️ 올리지 못했어요: '+sync.err+' · 이 폰 기록은 그대로예요');
    });
    return true;
  }catch(e){ return false; }
}
function cloudPush(){
  if(sync.status!=='on'||!sync.doc) return;
  clearTimeout(sync.pushTimer);
  sync.pushTimer=setTimeout(function(){ sync.pushTimer=null; doPush(); },300);
}
/* 화면을 떠나기 직전: 대기 중인 디바운스 업로드를 즉시 보냅니다 */
function flushPush(){
  if(sync.pushTimer){ clearTimeout(sync.pushTimer); sync.pushTimer=null; }
  if(sync.dirty&&sync.status==='on'&&sync.doc) return doPush();
  return false;
}

/* ── 받기 ── */
function applyCloudData(data,quiet,force){
  if(!data||typeof data!=='object') return false;
  var cloud;
  try{ cloud=normalize(data); }catch(e){ return false; }
  var ui=state.ui;                                  /* 보기 설정(탭·날짜)은 기기별로 유지 */
  var cloudSig=syncSig(cloud);

  /* 사용자가 '☁️ 클라우드 기록 불러오기'를 직접 고른 경우 → 클라우드로 대체 */
  if(force){
    cloud.ui=ui;
    var forceChanged=(cloudSig!==syncSig(state));
    if(forceChanged){ state=cloud; saveLocal(true); render(); }
    setBase(cloud);
    sync.dirty=false;
    writeSyncMeta(sync.code);
    sync.lastPull=new Date().toISOString();
    if(forceChanged&&!quiet) toast('☁️ 클라우드 기록을 불러왔어요');
    return forceChanged;
  }

  /* 이 폰에 아직 새 기록이 없으면(시드 그대로) 클라우드 기록을 그대로 받아요 */
  if(!sync.base&&isSeedLike(state)) return applyCloudData(data,quiet,true);

  /* 기본은 덮어쓰기가 아니라 병합: 두 기기가 다른 날짜·항목을 고쳤어도 서로 살립니다 */
  var merged=mergeStates(sync.base,state,cloud);
  var conflicts=merged.conflicts||0;
  delete merged.conflicts;
  merged.ui=ui;
  var localSig=syncSig(state);
  var mergedSig=syncSig(merged);
  sync.lastPull=new Date().toISOString();

  if(mergedSig===localSig){
    /* 이 폰이 이미 앞서 있거나 같음 → 표시만 정리하고 필요하면 이 폰 기록을 올림 */
    setBase(cloud);
    var ahead=(localSig!==cloudSig);
    sync.dirty=ahead;
    writeSyncMeta(sync.code);
    if(ahead) cloudPush();
    return false;
  }

  state=merged;
  saveLocal(true);
  render();
  setBase(cloud);
  sync.dirty=(mergedSig!==cloudSig);
  writeSyncMeta(sync.code);
  if(sync.dirty) cloudPush();
  if(!quiet) toast(conflicts?'☁️ 다른 기기 기록을 합쳤어요 · 겹친 항목은 이 폰 기록을 남겼어요':'☁️ 다른 기기에서 바뀐 내용을 불러왔어요');
  return true;
}
function cloudSubscribe(){
  if(!sync.doc) return;
  if(sync.unsub){ try{ sync.unsub(); }catch(e){} sync.unsub=null; }
  var first=true;
  try{
    sync.unsub=sync.doc.onSnapshot(function(snap){
      if(!snap) return;
      if(snap.metadata&&snap.metadata.hasPendingWrites) return;
      if(!snap.exists) return;                       /* delete 권한이 없어 사라질 일은 없음 */
      var d=snap.data()||{};
      if(d.updatedBy===sync.deviceId){               /* 내가 올린 그대로 */
        paintCloud(); first=false;
        if(sync.dirty) cloudPush();                  /* 못 올린 변경이 있으면 마저 올림 */
        return;
      }
      var data=null;
      try{ data=JSON.parse(String(d.payload||'null')); }catch(e){}
      /* 첫 스냅샷·재연결에서도 이 폰에 아직 못 올린 변경(dirty)이 있으면
         무조건 덮어쓰지 않고 base 기준으로 합칩니다. */
      applyCloudData(data,first);
      first=false;
      paintCloud();
    },function(err){
      sync.status='error';
      sync.err=(err&&err.message)?err.message:'연결이 끊겼어요';
      paintCloud();
    });
  }catch(e){
    sync.status='error'; sync.err='실시간 연결을 시작하지 못했어요'; paintCloud();
  }
}

/* ── 연결 / 해제 ── */
function finishConnect(silent,msg){
  sync.status='on'; sync.err='';
  writeSyncMeta(sync.code);
  cloudSubscribe();
  paintCloud();
  if(msg&&!silent) toast('☁️ '+msg);
}
function connectCloud(rawCode,silent){
  var code=cleanCode(rawCode);
  if(code.length<8){
    if(!silent) toast('가족 코드는 영문·숫자로 8자 이상이어야 해요');
    return;
  }
  sync.code=code;
  sync.status='connecting'; sync.err='';
  paintCloud();
  loadFirebase(function(err){
    if(err){
      sync.status='off'; sync.err='클라우드에 연결하지 못했어요 (오프라인?)';
      paintCloud();
      if(!silent) toast('지금은 클라우드에 연결하지 못했어요. 기록은 이 폰에 그대로 있어요');
      return;
    }
    var db=cloudDb();
    if(!db){
      sync.status='off'; sync.err='클라우드를 시작하지 못했어요';
      paintCloud();
      if(!silent) toast('클라우드를 시작하지 못했어요. 기록은 이 폰에 그대로 있어요');
      return;
    }
    sync.db=db;
    var ref=cloudDocRef(db,code);
    if(!ref){
      sync.status='off'; sync.err='코드를 쓸 수 없어요';
      paintCloud();
      return;
    }
    ref.get().then(function(snap){
      if(!snap.exists){
        /* 클라우드가 비었을 때 → 이 폰 기록을 올리고 시작 */
        return ref.set({
          payload:JSON.stringify(syncData(state)),
          updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
          updatedBy:sync.deviceId
        }).then(function(){
          sync.doc=ref;
          sync.lastPush=new Date().toISOString();
          sync.dirty=false;
          setBase(state);
          finishConnect(silent,'새 가족 공유를 시작했어요 · 이 폰 기록을 올렸어요');
        });
      }
      var data=null;
      try{ data=JSON.parse(String((snap.data()||{}).payload||'null')); }catch(e){}
      if(silent){
        /* 앱을 다시 열었을 때의 자동 재연결: 예전에 고른 방식대로 바로 구독 */
        sync.doc=ref;
        finishConnect(true,null);
        return;
      }
      askCloudMerge(ref,syncSummary(data?normalize(data):null),syncSummary(state));
    }).catch(function(err){
      var code2=(err&&err.code)?String(err.code):'';
      sync.status='off';
      sync.err=(code2.indexOf('permission-denied')>=0)?'이 코드로는 저장할 수 없어요 (보안 규칙)':((err&&err.message)||'클라우드에 연결하지 못했어요');
      paintCloud();
      if(!silent) toast('연결하지 못했어요: '+sync.err);
    });
  });
}
/* 병합 선택 뒤에는 선택지 화면을 닫고 설정을 다시 그려 연결 상태를 보여줌 */
function afterMergeUI(){
  closeSheet();
  openSettings();
}
function askCloudMerge(ref,cloudTxt,mineTxt){
  sync.pendingRef=ref;
  var seedLike=isSeedLike(state);
  var body='<p class="sheet-note" style="font-weight:700;color:#BF5C42">클라우드에 이미 저장된 기록이 있어요. 어느 쪽을 남길지 골라 주세요.</p>'+
    '<p class="sheet-note">☁️ 클라우드 · '+esc(cloudTxt)+'<br>📱 이 폰 · '+esc(mineTxt)+'</p>'+
    (seedLike?'<p class="sheet-note" style="font-weight:800;color:#3B7A57">이 폰에는 아직 새 기록이 없어요. 클라우드 기록을 불러오면 그대로 이어서 쓸 수 있어요.</p>':'')+
    '<p class="sheet-note">고르지 않은 쪽 기록은 사라져요. 가족 공유 중이라 고른 기록이 같은 코드를 쓴 모든 기기에 반영됩니다.</p>'+
    '<div class="sheet-actions" style="margin-top:0"><button type="button" class="btn btn-primary" data-act="sync-merge-cloud">☁️ 클라우드 기록 불러오기</button></div>'+
    '<div class="sheet-actions" style="margin-top:8px"><button type="button" class="btn btn-ghost" data-act="sync-merge-phone">📱 이 폰 기록 올리기</button></div>'+
    '<div class="sheet-actions" style="margin-top:8px"><button type="button" class="btn btn-ghost" data-act="sync-merge-cancel">그만두기</button></div>';
  openSheet({title:'☁️ 가족 공유 연결',body:body});
}
function mergeTakeCloud(){
  var ref=sync.pendingRef;
  if(!ref){ cancelConnect(); return; }
  sync.status='connecting'; sync.err=''; paintCloud();
  ref.get().then(function(snap){
    if(!snap.exists){ mergeTakePhone(); return; }
    var data=null;
    try{ data=JSON.parse(String((snap.data()||{}).payload||'null')); }catch(e){}
    var ok=applyCloudData(data,true,true);
    sync.doc=ref; sync.pendingRef=null;
    finishConnect(false,ok?'클라우드 기록을 이 폰에 불러왔어요':'클라우드 기록이 이 폰과 같았어요');
    afterMergeUI();
  }).catch(function(err){
    sync.status='off'; sync.err=(err&&err.message)?err.message:'클라우드 기록을 읽지 못했어요';
    paintCloud();
    toast('클라우드 기록을 읽지 못했어요. 잠시 뒤 다시 시도해 주세요');
  });
}
function mergeTakePhone(){
  var ref=sync.pendingRef;
  if(!ref){ cancelConnect(); return; }
  sync.status='connecting'; sync.err=''; paintCloud();
  try{
    ref.set({
      payload:JSON.stringify(syncData(state)),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy:sync.deviceId
    }).then(function(){
      sync.doc=ref; sync.pendingRef=null;
      sync.lastPush=new Date().toISOString();
      sync.dirty=false;
      setBase(state);
      finishConnect(false,'이 폰 기록을 클라우드에 올렸어요');
      afterMergeUI();
    },function(err){
      sync.status='off'; sync.err=(err&&err.message)?err.message:'클라우드에 올리지 못했어요';
      paintCloud();
      toast('클라우드에 올리지 못했어요. 이 폰 기록은 그대로 있어요');
    });
  }catch(e){
    sync.status='off'; sync.err='클라우드에 올리지 못했어요'; paintCloud();
  }
}
function cancelConnect(reopen){
  sync.pendingRef=null; sync.doc=null; sync.code=''; sync.status='off'; sync.err='';
  writeSyncMeta('');
  paintCloud();
  toast('연결을 그만뒀어요 · 이 폰 기록은 그대로예요');
  if(reopen===false) closeSheet();
  else afterMergeUI();
}
function disconnectCloud(){
  if(sync.unsub){ try{ sync.unsub(); }catch(e){} sync.unsub=null; }
  clearTimeout(sync.pushTimer); sync.pushTimer=null;
  sync.status='off'; sync.code=''; sync.err=''; sync.doc=null; sync.db=null; sync.pendingRef=null;
  sync.lastPush=null; sync.lastPull=null; sync.base=null;
  try{ localStorage.removeItem(SYNCED_KEY); }catch(e){}
  writeSyncMeta('');
  paintCloud();
  toast('☁️ 연결을 해제했어요 · 이 폰 기록은 그대로 있어요');
}

/* ── 화면(배지·설정) ── */
function syncBoxHtml(){
  if(sync.status==='on'){
    return '<div class="sync-badge">☁️ 실시간 연결됨</div>'+
      '<p class="sheet-note" style="margin:10px 0 0">가족 코드 <span class="sync-code">'+esc(sync.code)+'</span></p>'+
      '<p class="sync-line" id="syncLast">'+esc(lastSyncText())+'</p>'+
      (sync.err?'<p class="sheet-note err" style="margin:6px 0 0">⚠ '+esc(sync.err)+'</p>':'')+
      '<p class="sheet-note" style="margin:10px 0 10px">이 폰에서 고친 내용이 바로 클라우드에 올라가고, 같은 코드를 넣은 다른 기기에도 자동으로 나타나요.</p>'+
      '<div class="sheet-actions" style="margin-top:0">'+
        '<button type="button" class="btn btn-ghost" data-act="sync-push">지금 올리기</button>'+
        '<button type="button" class="btn btn-danger" data-act="sync-off">연결 해제</button>'+
      '</div>';
  }
  if(sync.status==='connecting'){
    return '<div class="sync-badge busy">☁️ 연결하는 중…</div>'+
      (sync.code?'<p class="sheet-note" style="margin:10px 0 0">코드 <span class="sync-code">'+esc(sync.code)+'</span></p>':'')+
      '<p class="sync-line">잠시만 기다려 주세요.</p>';
  }
  var head=(sync.status==='error')?'<div class="sync-badge bad">☁️ 연결이 끊겼어요</div>':'<div class="sync-badge" style="background:#F3EDE7;color:#8A7C6E;border-color:#EADFD3">📍 이 폰에만 저장 중</div>';
  var err=(sync.err)?'<p class="sheet-note err" style="margin:10px 0 0">'+esc(sync.err)+'</p>':'<p class="sheet-note" style="margin:10px 0 0">같은 가족 코드를 넣은 기기끼리 기록이 실시간으로 맞춰져요. 비워 두면 지금처럼 이 폰에만 저장돼요.</p>';
  return head+
    '<label class="field" style="margin-top:12px">가족 공유 코드<input id="fFamilyCode" type="text" maxlength="64" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" value="'+esc(sync.code||'')+'" placeholder="영문·숫자 8자 이상"></label>'+err+
    '<div class="sheet-actions" style="margin-top:0">'+
      '<button type="button" class="btn btn-primary" data-act="sync-connect">연결하기</button>'+
      '<button type="button" class="btn btn-ghost" data-act="sync-random">랜덤 코드</button>'+
    '</div>';
}
/* 설정 화면의 가족 공유 안내 문구를 현재 연결 상태에 맞게 즉시 갱신 (연결 해제 포함) */
function paintSyncNotes(){
  var p=document.getElementById('profileSyncNote');
  if(p) p.textContent=(sync.status==='on'
      ?'가족 공유 중이라 이름·생일도 같은 코드를 쓴 기기끼리 함께 보여요.'
      :'이름·생일은 이 기기(브라우저)에만 저장돼요.')
    +' 이름을 비우면 \'우리 아기\'로 보여요.';
  var r=document.getElementById('resetSyncNote');
  if(r) r.textContent='기록·재고·도감이 기본값으로 돌아가요. 되돌릴 수 없어요.'
    +(sync.status==='on'?' 가족 공유 중이라 연결된 다른 기기에도 함께 반영돼요.':'');
}
function paintCloud(){
  var dot=document.getElementById('cloudDot');
  if(dot){
    dot.classList.toggle('hidden', sync.status==='off');
    dot.classList.toggle('busy', sync.status==='connecting');
    dot.classList.toggle('bad', sync.status==='error');
    dot.setAttribute('title', sync.status==='on'?('☁️ 가족 코드 '+sync.code+' · 실시간 공유 중'):(sync.status==='connecting'?'☁️ 클라우드에 연결하는 중':'☁️ 클라우드 연결에 문제가 있어요'));
  }
  var box=document.getElementById('syncBox');
  if(box){
    if(box.getAttribute('data-key')!==syncKey()){
      box.setAttribute('data-key',syncKey());
      box.innerHTML=syncBoxHtml();
    }
    var last=document.getElementById('syncLast');
    if(last) last.textContent=lastSyncText();
  }
  paintSyncNotes();
}
function initCloud(){
  var meta=readSyncMeta();
  sync.deviceId=meta.deviceId;
  sync.code=cleanCode(meta.code);
  sync.dirty=meta.dirty===true;
  sync.base=loadBase();
  paintCloud();
  if(sync.code.length>=8) connectCloud(sync.code,true);
}

/* ───────── 이벤트 ───────── */
document.addEventListener('click', function(ev){
  var b=ev.target.closest?ev.target.closest('[data-amt]'):null;
  if(!b) return;
  var seg=b.parentNode;
  Array.prototype.forEach.call(seg.children, function(c){
    if(c.getAttribute('data-amt')) c.classList.remove('on');
  });
  b.classList.add('on');
  syncAmtSkip(document);
});

document.addEventListener('click', function(ev){
  var el=ev.target.closest?ev.target.closest('[data-act]'):null;
  if(!el) return;
  var act=el.getAttribute('data-act');
  var id=el.getAttribute('data-id');
  var date=el.getAttribute('data-date');
  switch(act){
    case 'tab': setView(el.getAttribute('data-view')); break;
    case 'mode': state.ui.mode=el.getAttribute('data-mode'); saveUi(true); render(); break;
    case 'sel-date': selectDate(date); break;
    case 'day-shift': selectDate(addDays(isDate(state.ui.sel)?state.ui.sel:todayISO(), Number(el.getAttribute('data-n')))); break;
    case 'go-today': selectDate(todayISO()); break;
    case 'cal-shift':
      state.ui.calMonth=shiftMonth(state.ui.calMonth||monthKey(state.ui.sel||todayISO()), Number(el.getAttribute('data-n')));
      saveUi(true); render();
      break;
    case 'log': openLogOrConfirm(date); break;
    case 'log-del': deleteLog(date); break;
    case 'go-today-log':
      closeSheet();
      selectDate(todayISO());
      openLogSheet(todayISO());
      break;
    case 'entry-new': openEntrySheet(null, isDate(date)?date:state.ui.sel); break;
    case 'plan-link':
      if(isDate(date)){
        state.ui.view='plan'; state.ui.sel=date; state.ui.calMonth=monthKey(date);
        saveUi(true); render();
        try{ window.scrollTo(0,0); }catch(e){}
      }
      break;
    case 'entry-edit': openEntrySheet(id); break;
    case 'principles-edit': openPrinciplesSheet(); break;
    case 'entry-del': deleteEntry(id); break;
    case 'stock-new': openStockSheet(null); break;
    case 'stock-edit': openStockSheet(id); break;
    case 'stock-inc': changeQty(id,1); break;
    case 'stock-dec': changeQty(id,-1); break;
    case 'stock-open': openOpenSheet(id); break;
    case 'stock-unopen':
      var so=findStock(id);
      if(so){ so.opened=''; save(); render(); toast('개봉을 취소했어요'); }
      break;
    case 'stock-finish': finishPack(id); break;
    case 'stock-arrive': markArrived(id); break;
    case 'stock-del': deleteStock(id); break;
    case 'ing-new': openIngSheet(null); break;
    case 'ing-edit': openIngSheet(id); break;
    case 'ing-status': setIngStatus(id, el.getAttribute('data-v')); break;
    case 'ing-snooze': ingSnooze[id]=true; render(); break;
    case 'ing-del': deleteIng(id); break;
    case 'brand-new': openBrandSheet(null); break;
    case 'brand-edit': openBrandSheet(id); break;
    case 'brand-del': deleteBrand(id); break;
    case 'settings': openSettings(); break;
    case 'sync-connect':
      var syncInp=document.getElementById('fFamilyCode');
      connectCloud(syncInp?syncInp.value:sync.code);
      break;
    case 'sync-random':
      var rc=randomCode();
      var rcInp=document.getElementById('fFamilyCode');
      if(rcInp) rcInp.value=rc;
      toast('가족 코드를 만들었어요: '+rc+' · 다른 기기에 똑같이 넣어 주세요');
      break;
    case 'sync-off': disconnectCloud(); break;
    case 'sync-push':
      if(sync.status!=='on'||!doPush(true)){ toast('먼저 가족 코드로 연결해 주세요'); break; }
      toast('☁️ 클라우드에 올리는 중…');
      break;
    case 'sync-merge-cloud': mergeTakeCloud(); break;
    case 'sync-merge-phone': mergeTakePhone(); break;
    case 'sync-merge-cancel': cancelConnect(); break;
    case 'close-sheet':
      /* 병합 선택지를 닫는 건 연결을 그만두는 것과 같음 (연결 중 상태로 남지 않도록) */
      if(sync.pendingRef) cancelConnect(false);
      else closeSheet();
      break;
    case 'export': exportFile(); break;
    case 'export-text': copyBackup(); break;
    case 'import-text': importText(); break;
    case 'undo-import': undoImport(); break;
    case 'reset': resetAll(el); break;
    default: break;
  }
});

document.addEventListener('change', function(ev){
  var el=ev.target;
  if(!el||!el.getAttribute) return;
  var mid=el.getAttribute('data-memo');
  if(mid){
    state.ingredients.forEach(function(g){ if(g.id===mid) g.memo=(el.value||'').trim(); });
    save(true);
  }
});

document.addEventListener('keydown', function(ev){
  if(ev.key==='Escape'){
    if(sync.pendingRef) cancelConnect(false);
    else closeSheet();
  }
});

document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    /* 화면을 떠나기 직전: 대기 중인 업로드를 즉시 전송 */
    flushPush();
    return;
  }
  if(todayISO()!==bootDay){
    bootDay=todayISO();
    state.ui.sel=bootDay;
    state.ui.calMonth=monthKey(bootDay);
  }
  render();
});
/* 앱이 백그라운드로 갈 때(pagehide)도 디바운스 대기분을 바로 올림 */
window.addEventListener('pagehide', function(){ flushPush(); });

/* 인터넷이 돌아오면 끊긴 가족 공유를 한 번 다시 시도 */
window.addEventListener('online', function(){
  if(sync.code.length>=8&&(sync.status==='error'||sync.status==='off')) connectCloud(sync.code,true);
  else flushPush();
});

/* ───────── 아래로 당겨서 새로고침 ─────────
   · 맨 위(scrollY<=0)에서, 시트가 닫혀 있을 때만 동작
   · 70px 이상 당기고 놓으면 인디케이터 후 새로고침
   · 일반 스크롤·버튼 탭은 건드리지 않습니다. */
var PULL_TRIGGER=70, PULL_MAX=120;
var pull={on:false,from:0,dy:0,ready:false,busy:false};
function pullEl(){ return document.getElementById('pullRefresh'); }
function atTop(){
  return (window.pageYOffset||document.documentElement.scrollTop||document.body.scrollTop||0)<=0;
}
function sheetIsOpen(){
  var s=document.getElementById('sheet');
  return document.body.classList.contains('sheet-open')||!!(s&&s.classList.contains('open'));
}
function pullReset(){
  pull.on=false; pull.dy=0; pull.ready=false;
  var el=pullEl();
  if(el&&!pull.busy){
    el.classList.remove('on','ready');
    el.style.transform='';
    el.textContent='↻ 새로고침';
  }
}
function pullPaint(){
  var el=pullEl();
  if(!el) return;
  el.classList.add('on');
  el.classList.toggle('ready', pull.ready);
  el.textContent=pull.ready?'↻ 놓으면 새로고침':'↻ 아래로 당겨 새로고침';
  el.style.transform='translate(-50%,'+(-72+Math.min(80,pull.dy))+'px)';
}
document.addEventListener('touchstart', function(ev){
  if(pull.busy||ev.touches.length!==1||sheetIsOpen()||!atTop()){ pull.on=false; return; }
  pull.on=true; pull.from=ev.touches[0].clientY; pull.dy=0; pull.ready=false;
},{passive:true});
document.addEventListener('touchmove', function(ev){
  if(!pull.on||pull.busy) return;
  var dy=ev.touches[0].clientY-pull.from;
  if(dy<=0){
    if(pull.dy>0) pullReset();
    if(dy<-8) pull.on=false;
    return;
  }
  if(!atTop()){ pullReset(); return; }
  if(ev.cancelable) ev.preventDefault();          /* 당기는 동안만 기본 동작 막음 */
  pull.dy=dy;
  pull.ready=(dy>=PULL_TRIGGER);
  pullPaint();
},{passive:false});
document.addEventListener('touchend', function(){
  if(!pull.on) return;
  pull.on=false;
  if(pull.ready&&!pull.busy){
    pull.busy=true;
    var el=pullEl();
    if(el){
      el.classList.remove('ready');
      el.classList.add('on','busy');
      el.textContent='↻ 새로고침 중...';
      el.style.transform='translate(-50%,8px)';
    }
    setTimeout(function(){ try{ location.reload(); }catch(e){} },160);
    return;
  }
  pullReset();
},{passive:true});
document.addEventListener('touchcancel', function(){ pull.on=false; pullReset(); },{passive:true});

/* 스크롤했을 때만 상단 헤더에 그림자를 줘 내용과 확실히 구분 */
var topbarEl=document.querySelector('.topbar');
var stuckTick=false;
function syncStuck(){
  stuckTick=false;
  if(!topbarEl) return;
  var y=(window.pageYOffset||document.documentElement.scrollTop||0);
  topbarEl.classList.toggle('stuck', y>2);
}
window.addEventListener('scroll', function(){
  if(stuckTick) return;
  stuckTick=true;
  if(window.requestAnimationFrame) window.requestAnimationFrame(syncStuck);
  else setTimeout(syncStuck,16);
},{passive:true});
syncStuck();

render();
initCloud();
if(bootCorrupt) toast('저장 데이터가 깨져 있어 원문을 따로 보관했어요. 설정에서 백업을 확인해 주세요');
})();
</script>
