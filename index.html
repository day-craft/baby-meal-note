<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-title" content="우리 아기 이유식">
<title>우리 아기 이유식 노트</title>
<style>
:root{
  --bg:#FFFBF7; --card:#FFFEFC; --ink:#3F3A33; --ink-2:#5F574C; --muted:#9C8A7B;
  --line:#F5E2D4; --coral:#E9745B; --coral-d:#C0573F; --coral-soft:#FCE8DC;
  --peach:#F28A70; --peach-d:#BF5C42; --peach-soft:#FFEBE3;
  --warn:#C0563F; --warn-soft:#FBE6DE;
  --shadow:0 4px 16px rgba(150,104,78,.09);
  --r:20px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0;min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Apple SD Gothic","Malgun Gothic",system-ui,"Segoe UI",sans-serif;
  color:var(--ink);font-size:15px;line-height:1.55;
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
/* iOS Safari에서 background-attachment:fixed가 깨지는 문제 -> 고정 레이어로 대체 */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(680px 380px at 100% -6%, #FFE6D6 0%, rgba(255,230,214,0) 62%),
    radial-gradient(560px 340px at -8% 4%, #FFF0E1 0%, rgba(255,240,225,0) 58%);
  background-repeat:no-repeat;background-position:top right,top left}
/* 시트가 열린 동안 뒤 페이지 스크롤 잠금 (스크롤 위치는 JS가 보관) */
body.sheet-open{position:fixed;left:0;right:0;width:100%;overflow:hidden}
button{font-family:inherit}
.hidden{display:none !important}
.warnbar{display:none;margin:0 0 12px;padding:11px 13px;border-radius:14px;background:#FFF1E6;border:1px solid #F6DBC9;
  color:#96543A;font-size:11.5px;font-weight:700;line-height:1.5}
.warnbar.on{display:block}

.app{max-width:820px;margin:0 auto;padding:0 16px;padding-bottom:calc(124px + env(safe-area-inset-bottom))}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 12px;
  padding-top:calc(14px + env(safe-area-inset-top));
  /* 스크롤한 내용이 비쳐 보이지 않도록 불투명 배경 (반투명+블러 제거) */
  background:#FFFBF7;
  background-image:radial-gradient(520px 190px at 100% -34%, #FFE7D8 0%, rgba(255,231,216,0) 72%),
                   radial-gradient(420px 170px at -12% -6%, #FFF3E8 0%, rgba(255,243,232,0) 70%);
  background-repeat:no-repeat;
  box-shadow:0 0 0 rgba(150,104,78,0);
  transition:box-shadow .18s ease}
.topbar.stuck{box-shadow:0 1px 0 #F5E2D4, 0 6px 18px rgba(150,104,78,.07)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto;
  background:linear-gradient(150deg,#FFE1CE,#FFEFE2);box-shadow:0 2px 10px rgba(222,138,110,.16)}
.brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.brand p{margin:3px 0 0;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:-.01em;line-height:1.42}
.brand p .meta-main{color:#A9765C;font-weight:800}
.brand p .meta-stage{display:block;color:#B3A597;font-weight:600;font-size:11px}
.icon-btn{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:rgba(255,254,252,.94);
  color:var(--ink-2);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;-webkit-appearance:none}

/* ── headings ── */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 2px 10px}
.sec-title{font-size:13px;font-weight:800;color:#7C6E60;letter-spacing:.02em}
.sec-sub{font-size:11.5px;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}

/* ── hero (today card) ── */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px;
  background:linear-gradient(155deg,#FFFFFF 0%,#FFFBF6 46%,#FFF2E8 100%);
  border:1px solid #F6E3D4;box-shadow:0 10px 30px rgba(160,112,84,.12)}
.hero::after{content:"";position:absolute;right:-44px;top:-56px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,#FFE2D0 0%,rgba(255,226,208,0) 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero-date{display:flex;align-items:center;gap:2px}
.daynav{width:28px;height:28px;border-radius:10px;border:1px solid var(--line);background:#FFFEFC;color:var(--ink-2);
  font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-appearance:none;padding:0 0 2px}
.hero-date-text{font-size:13px;font-weight:800;color:#7A6A5C;padding:0 6px;letter-spacing:-.01em}
.hero-date-text em{font-style:normal;color:var(--coral-d)}
.today-chip{margin-left:6px;font-size:11px;font-weight:800;color:var(--coral-d);background:#FCEADE;border:0;border-radius:999px;padding:5px 9px;cursor:pointer}
.hero-kicker{margin-top:15px;font-size:11.5px;font-weight:800;color:var(--peach-d);letter-spacing:.01em}
.hero-menu{margin:4px 0 0;font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.26;color:#3A342D;word-break:keep-all}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.meta-pill{font-size:12px;font-weight:700;color:#9E6448;background:#FDF0E4;border-radius:999px;padding:4px 10px}
.hero-note{margin:10px 0 0;font-size:12.5px;color:#86776A;line-height:1.5;word-break:keep-all}
.hero-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hero-actions .btn{flex:1 1 auto}
.empty-msg{margin:20px 0 4px;font-size:14px;font-weight:700;color:#948272;text-align:center;line-height:1.5}

/* ── log summary ── */
.logbox{margin-top:15px;border-radius:16px;background:#FDF2E9;border:1px solid #F7E1D0;padding:12px 14px}
.logbox-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logbox-amt{font-size:13.5px;font-weight:800;color:#BF5C42}
.logbox-skip{background:#F8F1E8;border-color:#F0E3D5}
.logbox-skip .logbox-amt{color:#8F8274}
.logbox-grams{font-size:12px;font-weight:700;color:#9A8271}
.logbox-memo{margin:6px 0 0;font-size:12.5px;color:#8A7466;white-space:pre-wrap;word-break:break-word}
/* ── 2식(오전·오후) 기록 박스 ── */
.logbox-rows{display:flex;flex-direction:column}
.logbox-row+.logbox-row{margin-top:9px;padding-top:9px;border-top:1px dashed #EFD9C8}
.logbox-rowtop{display:flex;align-items:center;gap:7px;min-width:0}
.logbox-slot{flex:0 0 auto;font-size:10.5px;font-weight:800;color:#A9755A;background:#FBE9DA;border-radius:7px;padding:2px 7px;letter-spacing:-.01em}
.logbox-empty{font-size:12px;font-weight:700;color:#B9AB9D}
.logbox-row .logbox-amt{font-size:13px}
.logbox-row .logbox-memo{margin-top:4px;padding-left:2px}
/* ── 먹인 기록 시트: 오전/오후 탭 ── */
.slottabs{display:flex;gap:7px;margin:2px 0 14px}
.slottabs button{flex:1 1 0;min-width:0;border:1px solid #F2E0D2;background:#FFFDF9;border-radius:14px;padding:9px 6px;min-height:52px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;-webkit-appearance:none}
.slottabs button .st-l{font-size:13px;font-weight:800;color:#7C6E60;letter-spacing:-.01em;white-space:nowrap}
.slottabs button .st-l em{font-style:normal;font-size:10px;font-weight:700;color:#BE9F8D}
.slottabs button .st-s{font-size:10.5px;font-weight:700;color:#B6A697;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slottabs button.on{background:#FCE8DC;border-color:#F5C9B4;box-shadow:0 2px 6px rgba(200,130,100,.12)}
.slottabs button.on .st-l{color:#B85B41}
.slottabs button.on .st-l em{color:#C08A70}
.slottabs button.on .st-s{color:#C08A70}
.slotclear{margin-top:6px}
/* ── 식단 시트: 하루 끼니 · 연결할 재고 팩 ── */
.seg#mealSeg button{font-size:12px}
.packpick{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;max-height:216px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.packchip{display:flex;align-items:center;gap:9px;border:1px solid #F2E3D5;background:#FFFCF7;border-radius:13px;padding:10px 11px;
  font-size:12.5px;font-weight:700;color:#6F6357;cursor:pointer;line-height:1.35}
.packchip input{width:17px;height:17px;margin:0;flex:0 0 auto;accent-color:#E9745B}
.packchip.on{background:#FDF2E9;border-color:#F7D9C8;color:#8A4B33}
.packchip .pk-sub{margin-left:auto;font-size:10.5px;font-weight:800;color:#A89A8B;white-space:nowrap;flex:0 0 auto}
.packchip.expected .pk-sub{color:#C08A40}
.linkbadge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:#8A5B3F;background:#FBEEE0;
  border:1px solid #F2DDC9;border-radius:999px;padding:4px 9px;cursor:pointer;letter-spacing:-.01em;-webkit-appearance:none}
.item-links{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}

/* ── badges ── */
.badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;letter-spacing:-.01em}
.badge-done{background:var(--coral-soft);color:var(--coral-d)}
.badge-peach{background:var(--peach-soft);color:var(--peach-d)}
.badge-muted{background:#F7EEE5;color:#958678}
.badge-skip{background:#F7EEE5;color:#938577;box-shadow:inset 0 0 0 1px #EFE3D7}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-soon{background:#FDEDD6;color:#B37618}

/* ── buttons ── */
.btn{font-size:13.5px;font-weight:800;border-radius:14px;padding:12px 16px;border:1px solid transparent;cursor:pointer;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:-.01em;
  transition:transform .12s ease, box-shadow .12s ease;-webkit-appearance:none}
.btn:active{transform:scale(.985)}
.btn-primary{background:linear-gradient(160deg,#F7906F,#E9745B);color:#fff;box-shadow:0 6px 16px rgba(233,116,91,.30)}
.btn-ghost{background:#FFFEFC;border-color:var(--line);color:#6B6155}
.btn-danger{background:#fff;border-color:#F3CEC2;color:var(--warn)}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:12.5px;min-height:38px;border-radius:11px}
.mini{font-size:11.5px;font-weight:700;color:#877A6C;background:#FBF4EC;border:1px solid #F4E4D6;border-radius:10px;
  padding:6px 9px;cursor:pointer;min-height:32px;-webkit-appearance:none}
.mini-primary{background:var(--coral-soft);color:var(--coral-d);border-color:#F7D9C8}
.mini-warn{background:#FDF0EA;color:#BF5C42;border-color:#F5DACB}

/* ── principles ── */
details.fold{margin-bottom:9px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12.5px;font-weight:800;color:#9A8B7C;background:#FBF4EC;border:1px dashed #EEDCCB;border-radius:14px;padding:10px 12px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold[open]>summary{margin-bottom:9px}
.fold-note{margin:0 2px 8px;font-size:11.5px;color:#A2937F}
details.card{padding:0;border-radius:18px}
details.card>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  font-size:13px;font-weight:800;color:#7C6E60;min-height:48px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .sum-left{display:flex;align-items:center;gap:7px}
.chev{color:#C4B4A4;font-size:11px;transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.rule-list{list-style:none;margin:0;padding:0 16px 14px}
.rule-list li{position:relative;padding:6px 0 6px 19px;font-size:12.5px;color:#7B6E60;line-height:1.55;word-break:keep-all}
.rule-list li::before{content:"";position:absolute;left:3px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--peach)}
.rule-list b{color:#4E463C;font-weight:800}
.rule-list .sub{color:#A5978A;font-size:11.5px}
.sum-right{flex:1;text-align:right;font-size:11px;font-weight:700;color:#B3A597;margin-right:8px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule-actions{padding:0 16px 15px;display:flex;gap:8px}

/* ── principle editor rows ── */
.rule-edit-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.rule-edit-row textarea{flex:1;min-width:0;font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink);
  background:#FFFCF8;border:1px solid #F2DFD1;border-radius:12px;padding:10px 11px;min-height:56px;resize:vertical;-webkit-appearance:none}
.rule-edit-row textarea:focus{outline:none;border-color:#F7C7B1;box-shadow:0 0 0 3px rgba(242,138,112,.18)}
.rule-edit-del{width:34px;height:34px;flex:0 0 auto;border-radius:11px;border:1px solid var(--line);background:#FFFCF8;
  color:#C0A695;font-size:14px;line-height:1;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center}
.rule-edit-add{width:100%;font-size:12.5px;font-weight:800;color:#C0573F;background:#FDF0E6;border:1px dashed #F3D5C4;
  border-radius:12px;padding:10px;cursor:pointer;min-height:42px;-webkit-appearance:none}
.rule-edit-add:disabled{color:#C9B6A7;background:#FCF6EF;border-color:#F0E3D8}

/* ── segmented toggle ── */
.seg-toggle{display:inline-flex;gap:4px;background:#F9EEE3;border-radius:14px;padding:4px;margin:18px 0 12px}
.seg-toggle button{font-size:12.5px;font-weight:800;border:0;background:transparent;color:#9A8B7C;padding:9px 18px;
  border-radius:11px;cursor:pointer;min-height:38px;-webkit-appearance:none}
.seg-toggle button.on{background:#FFFDF9;color:#B85B41;box-shadow:0 2px 6px rgba(180,120,90,.16)}

/* ── calendar ── */
.cal{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:12px 10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px}
.cal-title{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav .daynav{width:30px;height:30px}
/* 7열 고정: 어떤 달·긴 라벨이 와도 칸 너비/높이가 1px도 흔들리지 않게 */
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-grid{grid-auto-rows:58px}
.cal-dow span{text-align:center;font-size:10.5px;font-weight:700;color:#AEA091;padding:3px 0 6px}
.cal-dow span:first-child{color:#DE9A80}
.cal-cell{position:relative;border:0;background:transparent;border-radius:12px;
  min-width:0;width:100%;height:58px;min-height:0;overflow:hidden;padding:6px 2px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;cursor:pointer;color:var(--ink);-webkit-appearance:none}
.cal-d{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;flex:0 0 auto}
.cal-l{display:block;width:100%;max-width:100%;font-size:10px;font-weight:800;color:#BF5C42;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;line-height:1.15;flex:0 0 auto}
.cal-l.two{font-size:9.5px;line-height:1.1;white-space:normal;letter-spacing:-.02em}
.cal-l.two>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-cell.out{opacity:.3}
.cal-cell.has{background:#FDF2E9}
.cal-cell.has.future{background:#FFEBE3}
.cal-cell.has.future .cal-l{color:#C97A57}
.cal-cell.today{box-shadow:inset 0 0 0 2px #F7C3AC}
.cal-cell.sel{background:linear-gradient(160deg,#F28A70,#E9745B);box-shadow:0 6px 14px rgba(233,116,91,.32)}
.cal-cell.sel .cal-d{color:#fff}
.cal-cell.sel .cal-l{color:#FFFFFF}
/* 기록 점: 1끼 = 점 1개, 오전·오후 2끼 = 점 2개 (58px 고정 격자는 그대로) */
.cal-dots{position:absolute;left:0;right:0;bottom:3px;height:4px;display:flex;align-items:center;justify-content:center;gap:3px}
.cal-dots i{display:block;width:4px;height:4px;border-radius:50%;background:var(--peach-d)}
.cal-dots i.skip{background:#B9AC9E}
.cal-cell.sel .cal-dots i{background:#FFE3D2}
.cal-cell.sel .cal-dots i.skip{background:#EADDD1}
.cal-legend{display:flex;gap:14px;justify-content:center;margin-top:11px;font-size:10.5px;color:#AC9D8E;font-weight:700}
.cal-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}

/* ── list rows ── */
.row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:9px;cursor:pointer}
.row-active{border-color:#F7D9C8;background:linear-gradient(160deg,#FFFEFC,#FFF5ED)}
.row-skip{background:#FDF8F2;border-color:#F2E7DB}
.row-main{flex:1;min-width:0}
.row-title{font-size:14px;font-weight:800;letter-spacing:-.01em;color:#3D372F;word-break:keep-all}
.row-sub{margin-top:3px;font-size:11.5px;color:#9A8B7C;font-weight:600}
.row-sub.muted{color:#B3A597;font-weight:500;line-height:1.45}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}

/* ── stock ── */
.dday{display:flex;align-items:center;gap:12px;border-radius:18px;padding:13px 14px;margin-bottom:9px;
  background:linear-gradient(135deg,#FFFCF7,#FFF4EC);border:1px solid #F7E7D8}
.dday.warn{background:linear-gradient(135deg,#FFF9F1,#FCEFE2);border-color:#F4E0CB}
.dday.urgent{background:linear-gradient(135deg,#FDF0EC,#FBE6DF);border-color:#F2D2C6}
.dday.over{background:linear-gradient(135deg,#FBEDE9,#F8DED7);border-color:#EBBFB4}
.dday-main{flex:1;min-width:0}
.dday-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.dday-name{font-size:14px;font-weight:800;letter-spacing:-.01em}
.dday-sub{font-size:11.5px;color:#96867A;font-weight:600;margin-top:2px}
.dday-lab{font-size:15px;font-weight:900;color:#C0573F;letter-spacing:-.02em;white-space:nowrap}
.dday.warn .dday-lab{color:#BC8738}
.dday.urgent .dday-lab{color:#BF5C43}
.dday.over .dday-lab{color:#A8382A}
.bar{height:5px;border-radius:3px;background:#F5E6D9;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#FFB49A,#F28A70)}
.dday.urgent .bar>i,.dday.over .bar>i{background:linear-gradient(90deg,#E9A489,#CD6C4F)}

.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:9px}
.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.item-name{font-size:14px;font-weight:800;letter-spacing:-.01em;line-height:1.35;word-break:keep-all}
.tag{font-size:10.5px;font-weight:800;color:#938577;background:#F8F0E6;border-radius:7px;padding:2px 6px;margin-left:4px;white-space:nowrap}
.item-sub{font-size:11.5px;color:#9A8B7C;font-weight:600;margin-top:3px}
.item-note{font-size:11.5px;color:#AB9D8F;margin-top:4px;line-height:1.45;word-break:keep-all}
.item-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stepper{display:flex;align-items:center;border:1px solid #F4E3D4;border-radius:12px;overflow:hidden;background:#FFFEFC;flex:0 0 auto}
.stepper button{width:34px;height:34px;border:0;background:transparent;font-size:16px;color:#887A6C;cursor:pointer;
  -webkit-appearance:none;line-height:1}
.stepper button:disabled{color:#DCD0C3}
.stepper .qty{min-width:26px;text-align:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}

/* ── ingredients ── */
.alert-card{background:linear-gradient(135deg,#FFF9F1,#FCEFE2);border:1px solid #F4E0CB;border-radius:18px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
.alert-card.urgent{background:linear-gradient(135deg,#FDF0EC,#FBE6DF);border-color:#F2D2C6}
.alert-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:800;color:#8A4F38}
.alert-row{display:flex;align-items:center;gap:10px;margin-top:9px;padding-top:9px;border-top:1px dashed #EFD9C8}
.alert-row-main{flex:1;min-width:0;font-size:12.5px;line-height:1.4}
.alert-row-main b{display:block;font-size:13.5px;color:#3F3A33}
.alert-row-main span{color:#96867A;font-weight:600}
.alert-row-main span.late{color:#B0452F;font-weight:800}
.alert-foot{margin:8px 0 0;font-size:11px;color:#A2937F}
.ing-alert .ing-suggest{margin-top:8px}
.ing-suggest{margin-top:10px;border-radius:14px;background:#FDF4EA;border:1px solid #F4E2D0;padding:10px 12px}
.ing-suggest.warn{background:#FBECE6;border-color:#F0CFC2}
.ing-suggest p{margin:0;font-size:12.5px;font-weight:700;color:#7A5A47;line-height:1.45;word-break:keep-all}
.ing-suggest.warn p{color:#A8442F}
.ing-suggest-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ing-prog{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11.5px;font-weight:700;color:#A2937F}
.ing-prog .bar{flex:1;margin:0}
.ing-rx{margin:9px 0 0;padding:0;list-style:none;font-size:12px;color:#A8442F;font-weight:700}
.ing-rx li+li{margin-top:3px}
.ing-rx li span{color:#A2937F;font-weight:600;margin-right:5px}
.rx-chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 6px}
.rx-chips button{font-family:inherit;font-size:12px;font-weight:700;color:#877A6C;background:#FBF4EC;border:1px solid #F4E4D6;border-radius:999px;padding:6px 11px;cursor:pointer}
.rx-chips button.on{background:var(--coral-soft);color:var(--coral-d);border-color:#F2C9B5}
.rx-chips button.on.ok{background:#EAF4EC;color:#3B7A57;border-color:#CFE5D4}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:19px;font-weight:900;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;font-weight:700;color:#A2937F}
.stat.done b{color:#C0573F}
.stat.testing b{color:#C97948}
.stat.caution b{color:#B04A38}
.stat.todo b{color:#9A8B7C}

.ing{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:9px}
.ing-head{display:flex;align-items:center;gap:10px}
.ing-emoji{width:36px;height:36px;border-radius:12px;background:#FEF2E8;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.ing-name{flex:1;min-width:0;font-size:14px;font-weight:800;letter-spacing:-.01em}
.ing-name small{display:block;font-size:11px;color:#AB9D8F;font-weight:600;margin-top:1px}
.seg{display:flex;gap:3px;background:#F8EEE3;border-radius:12px;padding:3px;margin-top:11px}
.seg button{flex:1;border:0;background:transparent;font-size:11.5px;font-weight:800;color:#9D8F81;padding:8px 2px;
  border-radius:9px;cursor:pointer;min-height:34px;-webkit-appearance:none}
.seg button.on{background:#FFFDF9;color:#B85B41;box-shadow:0 2px 5px rgba(180,120,90,.14)}
.seg button.on[data-v="done"]{background:#FCE0D3;color:#B8523A}
.seg button.on[data-v="testing"]{background:#FDF0E4;color:#B9764A}
.seg button.on[data-v="caution"]{background:#FBE2DA;color:#B04A38}
.seg button.on[data-v="todo"]{background:#F5EDE4;color:#8A7D70}
.seg button.on[data-v="full"]{background:#FCE0D3;color:#B8523A}
.seg button.on[data-v="half"]{background:#FDEBDB;color:#BF6E47}
.seg button.on[data-v="little"]{background:#FFF0E2;color:#C0764F}
.seg button.on[data-v="refuse"]{background:#FBE2DA;color:#B04A38}
#amtSeg button{font-size:11px;padding:8px 0;letter-spacing:-.02em}
.ing-memo{display:block;width:100%;margin-top:9px;font-family:inherit;font-size:13px;color:#5F574C;
  background:#FFFCF7;border:1px solid #F3E4D6;border-radius:11px;padding:9px 11px;-webkit-appearance:none}
.ing-memo::placeholder{color:#C4B5A6}

/* ── tab bar ── */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
  width:min(520px,calc(100% - 24px));display:flex;gap:3px;padding:6px;z-index:40;
  background:rgba(255,253,249,.94);border:1px solid var(--line);border-radius:999px;
  box-shadow:0 10px 30px rgba(150,104,78,.18);

.tabbar button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;

.bcard-main{flex:1;min-width:0}
.bcard-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14.5px;font-weight:800;
  letter-spacing:-.01em;line-height:1.35;word-break:keep-all;color:#3D372F}
.bstatus{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap;letter-spacing:-.01em}
.bstatus.on{background:#FCE0D3;color:#B8523A}
.bstatus.done{background:#F7EEE5;color:#958678}
.bstatus.cand{background:#FDF0E4;color:#B9764A;box-shadow:inset 0 0 0 1px #F6E2CE}

.bpill{font-size:11px;font-weight:700;color:#9E6448;background:#FDF0E4;border-radius:999px;padding:3px 9px;letter-spacing:-.01em}
.bcard-note{margin-top:8px;font-size:11.5px;color:#9A8B7C;line-height:1.5;word-break:keep-all;white-space:pre-wrap}

/* ── sheet ── */
#sheet{position:fixed;inset:0;z-index:80;display:none}
#sheet.open{display:block}
.sheet-wrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(60,44,34,.38);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet-panel{position:relative;width:min(540px,100%);max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:var(--card);border-radius:26px 26px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(80,52,36,.20);animation:panelIn .22s cubic-bezier(.22,.8,.3,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:#EFDBCB;margin:6px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.02em}
.sheet-head .icon-btn{width:34px;height:34px;border-radius:11px;font-size:14px}
.sheet-actions{display:flex;gap:8px;margin-top:18px}
.sheet-actions .btn{flex:1}
.sheet-note{font-size:11.5px;color:#AB9D8F;line-height:1.55;margin:0 0 14px}
.sheet-note.err{color:#BF5C42;background:#FDF0EA;border:1px solid #F5DACB;border-radius:12px;padding:9px 11px;font-weight:700;white-space:pre-wrap}

/* ── forms ── */
.field{display:block;font-size:12px;font-weight:800;color:#8A7C6E;margin-bottom:12px}
.field input,.field textarea,.field select{display:block;width:100%;margin-top:6px;font-family:inherit;font-size:16px;
  color:var(--ink);background:#FFFCF7;border:1px solid #F2E3D5;border-radius:13px;padding:11px 12px;
  -webkit-appearance:none;appearance:none;font-weight:500}
.field textarea{line-height:1.5;resize:vertical;min-height:74px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:#F7C7B1;box-shadow:0 0 0 3px rgba(242,138,112,.18)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#8A7C6E;margin:-2px 0 14px}
.check input{width:18px;height:18px;margin:0}

/* ── 날짜별 목표 용량 (dailyGrams) ── */
.dg-box{border:1px solid #F2E3D5;background:#FFFCF7;border-radius:15px;padding:11px 12px 8px;margin:0 0 12px;transition:background .15s ease,border-color .15s ease}
.dg-box.on{background:#FFF9F4;border-color:#F7C7B1}
.dg-box .check{margin:0}
.dg-rows{margin:10px 0 6px}
.dg-row{display:grid;grid-template-columns:82px 1fr 13px;align-items:center;gap:8px;margin-bottom:7px}
.dg-date{font-size:12px;font-weight:800;color:#8A7C6E;letter-spacing:-.02em;white-space:nowrap}
.dg-row input{display:block;width:100%;margin:0;font-family:inherit;font-size:15px;font-weight:800;color:var(--ink);
  background:#FFFDF9;border:1px solid #F2E3D5;border-radius:11px;padding:8px 10px;text-align:right;
  -webkit-appearance:none;appearance:none;-moz-appearance:textfield}
.dg-row input::-webkit-outer-spin-button,.dg-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dg-row input:focus{outline:none;border-color:#F7C7B1;box-shadow:0 0 0 3px rgba(242,138,112,.18)}
.dg-row input.diff{background:#FFF1E6;border-color:#F3CDB7;color:#B8523A}
.dg-unit{font-size:11.5px;font-weight:800;color:#AB9D8F}
.dg-foot{font-size:11.5px;color:#AB9D8F;line-height:1.5;margin:0 0 8px;word-break:keep-all}

/* ── 아래로 당겨서 새로고침 ── */
#pullRefresh{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));z-index:130;
  transform:translate(-50%,-72px);opacity:0;pointer-events:none;
  background:rgba(62,46,36,.95);color:#FFF8F0;font-size:12px;font-weight:800;letter-spacing:-.01em;
  padding:8px 14px;border-radius:999px;white-space:nowrap;
  box-shadow:0 6px 18px rgba(80,52,36,.22);transition:opacity .16s ease}
#pullRefresh.on{opacity:1}
#pullRefresh.ready,#pullRefresh.busy{background:#B8523A}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  z-index:120;background:rgba(62,46,36,.95);color:#FFF8F0;font-size:12.5px;font-weight:700;padding:11px 16px;
  border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
  max-width:80vw;text-align:center;line-height:1.4}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(min-width:760px){
  .app{padding:0 24px;padding-bottom:140px}
  .brand h1{font-size:19px}
  .row-side{flex-direction:row;align-items:center}
  .hero{padding:22px 24px;border-radius:28px}
  .hero-menu{font-size:26px}
  .tabbar{width:420px}
  .sheet-wrap{align-items:center;padding:24px}
  .sheet-panel{border-radius:24px;max-height:86vh;padding-bottom:22px}
  .sheet-grip{display:none}
  .sheet-panel{animation:panelIn2 .2s ease-out}
  @keyframes panelIn2{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
}

/* ── ☁️ 실시간 가족 동기화 ── */
.top-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.cloud-dot{width:28px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;background:#EDF6F0;border:1px solid #CFE7D8}
.cloud-dot.busy{background:#FFF1E6;border-color:#F6DBC9}
.cloud-dot.bad{background:#FBE6DE;border-color:#F3CEC2}
.sync-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  background:#EDF6F0;color:#3B7A57;border:1px solid #CFE7D8;font-size:11.5px;font-weight:800}
.sync-badge.busy{background:#FFF1E6;color:#96543A;border-color:#F6DBC9}
.sync-badge.bad{background:#FBE6DE;color:#96543A;border-color:#F3CEC2}
.sync-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:800;
  color:#8A4B33;word-break:break-all}
.sync-line{font-size:11.5px;color:#AB9D8F;font-weight:600;line-height:1.55;margin:8px 0 0}
</style>
</head>

<script>
(function(){
'use strict';

var KEY='yebin-iyuk-planner-v1';
var UNDO_KEY=KEY+'-undo';
var CORRUPT_KEY=KEY+'-corrupt';
var bootCorrupt=false;
var sheetScrollY=0;
var AMOUNTS=[{v:'full',l:'완식',e:'😋'},{v:'half',l:'절반',e:'🙂'},{v:'little',l:'조금',e:'😕'},{v:'refuse',l:'거부',e:'🙈'},{v:'skip',l:'쉬어감',e:'⏸'}];
var AMT_LABEL={full:'완식',half:'절반',little:'조금',refuse:'거부',skip:'쉬어감'};
/* 하루 두 끼(오전·오후) 슬롯 */
var SLOTS=[{v:'am',l:'오전',n:'1식'},{v:'pm',l:'오후',n:'2식'}];
var ING_ST=[{v:'done',l:'통과'},{v:'testing',l:'관찰중'},{v:'caution',l:'주의'},{v:'todo',l:'미시도'}];
var ING_LABEL={done:'통과',testing:'관찰중',caution:'주의',todo:'미시도'};
var BRAND_ST=[{v:'active',l:'이용 중'},{v:'done',l:'이용 완료'},{v:'candidate',l:'후보'}];
var BRAND_LABEL={active:'이용 중',done:'이용 완료',candidate:'후보'};
var BRAND_CLS={active:'on',done:'done',candidate:'cand'};
var STORAGE_OK=true;

/* ───────── 날짜 도우미 ───────── */
function pad2(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayISO(){ return iso(new Date()); }
function parseISO(s){
  if(!s) return new Date(NaN);
  var p=String(s).split('-');
  return new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
}
function isDate(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))) return false;
  var d=parseISO(s);
  if(isNaN(d.getTime())) return false;
  return iso(d)===String(s);
}
function addDays(s,n){ var d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function mdShort(s){ var d=parseISO(s); return (d.getMonth()+1)+'/'+d.getDate(); }
/* 같은 달이면 11/22~24 처럼 짧게 */
function rangeShort(a,b){
  var da=parseISO(a), db=parseISO(b);
  if(!isNaN(da.getTime())&&!isNaN(db.getTime())&&da.getFullYear()===db.getFullYear()&&da.getMonth()===db.getMonth())
    return mdShort(a)+'~'+db.getDate();
  return mdShort(a)+'~'+mdShort(b);
}
function mdLong(s){ var d=parseISO(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function dowOf(s){ return '일월화수목금토'.charAt(parseISO(s).getDay()); }
function monthKey(s){ return String(s).slice(0,7); }
function shiftMonth(mk, delta){
  var y=Number(mk.slice(0,4)), m=Number(mk.slice(5,7))+delta;
  var d=new Date(y, m-1, 1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='"'?'&quot;':'&#39;';
  });
}
function uid(p){ return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function num(v,d){ var n=Number(v); return isFinite(n)?n:d; }

/* ───────── 저장/불러오기 ───────── */
function normalize(s){
  var base=seedState();
  s=(s&&typeof s==='object')?s:{};
  var p=s.profile||{};
  var out={
    version:1,
    profile:{
      /* 저장된 값이 있으면 그대로 살리고, 키 자체가 없을 때만 시드 기본값 (이름·생일 하드코딩 없음).
         빈 문자열("")로 명시된 값은 시드로 되살리지 않습니다. (S4) */
      name:(p.name!=null?String(p.name).trim().slice(0,20):''),
      stage:Object.prototype.hasOwnProperty.call(p,'stage')?String(p.stage==null?'':p.stage):base.profile.stage,
      birth:isDate(p.birth)?String(p.birth):'',
      startDate:Object.prototype.hasOwnProperty.call(p,'startDate')?(isDate(p.startDate)?String(p.startDate):''):base.profile.startDate
    },
    principles:{summary:base.principles.summary, items:base.principles.items.slice()},
    entries:[], logs:{}, stock:[], ingredients:[],
    brands:[],
    ui:{view:'plan',mode:'cal',sel:null,calMonth:null,ruleOpen:false},
    savedAt:s.savedAt||null
  };
  var u=s.ui||{};
  if(u.view==='plan'||u.view==='stock'||u.view==='ing'||u.view==='brands') out.ui.view=u.view;
  if(u.mode==='cal'||u.mode==='list') out.ui.mode=u.mode;
  if(isDate(u.sel)) out.ui.sel=u.sel;
  if(/^\d{4}-\d{2}$/.test(String(u.calMonth||''))) out.ui.calMonth=u.calMonth;
  if(typeof u.ruleOpen==='boolean') out.ui.ruleOpen=u.ruleOpen;

  var pr=(s.principles&&typeof s.principles==='object')?s.principles:{};
  if(pr.summary!=null) out.principles.summary=String(pr.summary).trim().slice(0,60);
  if(Array.isArray(pr.items)){
    out.principles.items=[];
    pr.items.forEach(function(it){
      var t=(it==null?'':String(it)).trim();
      if(!t||out.principles.items.length>=PR_MAX) return;
      out.principles.items.push(t.slice(0,140));
    });
  }

  if(Array.isArray(s.entries)){
    s.entries.forEach(function(e){
      if(!e||!isDate(e.start)||!isDate(e.end)||!e.menu) return;
      var a=e.start,b=e.end,tmp;
      if(b<a){ tmp=a; a=b; b=tmp; }
      var pids=[];
      if(Array.isArray(e.packIds)){
        e.packIds.forEach(function(pid){
          var s=String(pid==null?'':pid);
          if(s&&pids.indexOf(s)<0) pids.push(s);
        });
      }
      if(!pids.length&&e.packId) pids.push(String(e.packId));   /* 기존 단일 packId 자동 마이그레이션 */
      var rec={
        id:e.id?String(e.id):uid('e'), start:a, end:b, menu:String(e.menu),
        brand:e.brand?String(e.brand):'',
        short:e.short?String(e.short):String(e.menu).replace(/\s*(미음|죽)$/,'').slice(-3),
        grams:(e.grams==null||e.grams==='')?'':String(e.grams),
        note:e.note?String(e.note):'',
        mealsPerDay:(Number(e.mealsPerDay)===2?2:1),
        packId:(pids[0]||null), packIds:pids
      };
      /* dailyGrams 는 일정 기간 안의 날짜·숫자만 남기고, 비면 키 자체를 두지 않아요.
         (기존 저장본에 이 필드가 없으면 그대로 없이 유지 → 예전처럼 grams 사용) */
      var recDg=dailyGramsFit(e.dailyGrams, rec.start, rec.end);
      if(recDg) rec.dailyGrams=recDg;
      out.entries.push(rec);
    });
  } else {
    out.entries=base.entries;
  }
  out.entries.sort(function(a,b){ return a.start<b.start?-1:(a.start>b.start?1:0); });

  if(s.logs&&typeof s.logs==='object'){
    Object.keys(s.logs).forEach(function(k){
      var v=s.logs[k];
      if(!isDate(k)||!v||typeof v!=='object') return;
      var n=normLog(v);   /* 기존 1식 기록({amount,...})도 오전 슬롯 기록으로 그대로 읽힘 */
      if(n) out.logs[k]=n;
    });
  }
  if(Array.isArray(s.stock)){
    s.stock.forEach(function(it){
      if(!it||!it.name) return;
      out.stock.push({
        id:it.id?String(it.id):uid('s'), name:String(it.name),
        brand:it.brand?String(it.brand):'',
        size:Math.max(0,Math.round(num(it.size,0))),
        qty:Math.max(0,Math.min(99,Math.round(num(it.qty,1)))),
        status:(it.status==='expected')?'expected':'arrived',
        arrived:isDate(it.arrived)?it.arrived:(it.status==='expected'?'':todayISO()),
        expected:isDate(it.expected)?it.expected:'',
        opened:isDate(it.opened)?it.opened:'',
        shelfLife:Math.max(1,Math.min(14,Math.round(num(it.shelfLife,3)))),
        expiryDate:isDate(it.expiryDate)?it.expiryDate:'',
        note:it.note?String(it.note):''
      });
    });
  }
  if(Array.isArray(s.ingredients)){
    s.ingredients.forEach(function(g){
      if(!g||!g.name) return;
      out.ingredients.push({
        id:g.id?String(g.id):uid('i'), name:String(g.name),
        emoji:g.emoji?String(g.emoji):'🍽',
        status:ING_LABEL[g.status]?g.status:'todo',
        first:isDate(g.first)?g.first:'',
        memo:g.memo?String(g.memo):''
      });
    });
  }
  if(Array.isArray(s.brands)){
    s.brands.forEach(function(b){
      if(!b||!b.name) return;
      out.brands.push({
        id:b.id?String(b.id):uid('b'),
        name:String(b.name).trim().slice(0,40),
        status:BRAND_LABEL[b.status]?b.status:'candidate',
        size:b.size?String(b.size).trim().slice(0,40):'',
        shelf:b.shelf?String(b.shelf).trim().slice(0,40):'',
        memo:b.memo?String(b.memo).slice(0,400):''
      });
    });
  } else {
    out.brands=base.brands.map(function(b){ return {id:b.id,name:b.name,status:b.status,size:b.size,shelf:b.shelf,memo:b.memo}; });
  }
  return out;
}

function loadState(){
  var raw=null;
  try{ raw=localStorage.getItem(KEY); }
  catch(e){ STORAGE_OK=false; return seedState(); }
  if(!raw) return seedState();
  try{ return normalize(JSON.parse(raw)); }
  catch(e){
    /* 저장된 JSON이 깨졌을 때: 시드로 덮어쓰기 전에 깨진 원문을 따로 보관 */
    bootCorrupt=true;
    try{ localStorage.setItem(CORRUPT_KEY, String(raw)); }catch(e2){}
    return seedState();
  }
}
function syncWarnbar(){
  var wb=document.getElementById('warnbar');
  if(wb) wb.classList.toggle('on', !STORAGE_OK);
}
function saveLocal(silent){
  var nextAt=new Date().toISOString();
  var prevAt=state.savedAt;
  var payload;
  state.savedAt=nextAt;
  try{ payload=JSON.stringify(state); }
  catch(e){
    state.savedAt=prevAt;
    if(!silent) toast('저장할 데이터를 만들지 못했어요. 설정에서 백업해 두세요');
    return false;
  }
  try{
    localStorage.setItem(KEY, payload);
    /* 쓰기에 성공했을 때만 savedAt을 확정하고 경고 배너를 내림 */
    STORAGE_OK=true;
    syncWarnbar();
    return true;
  }catch(e){
    state.savedAt=prevAt;
    STORAGE_OK=false;
    syncWarnbar();
    if(!silent) toast('자동 저장이 안 돼요. 설정에서 백업해 두세요');
    return false;
  }
}
/* 저장 = 이 폰(localStorage) 먼저, 성공하면 클라우드로 디바운스 반영 */
function save(silent){
  var ok=saveLocal(silent);
  if(ok){
    sync.dirty=true;              /* 클라우드에 아직 못 올린 변경이 있음 */
    writeSyncMeta(sync.code);
    cloudPush();
  }
  return ok;
}

/* ───────── 날짜별 목표 용량 (dailyGrams) ─────────
   entries[].grams      = 이 일정의 기본 1회 목표량 ('50' 또는 '45~50')
   entries[].dailyGrams = { 'YYYY-MM-DD': 55 }  날짜별 목표량(g, 숫자)
   dailyGrams 에 없는 날짜는 기본 grams 를 그대로 씁니다. */
function dailyGramsFit(dg,start,end){
  if(!dg||typeof dg!=='object') return null;
  var hasRange=(isDate(start)&&isDate(end));
  var out={}, any=false;
  Object.keys(dg).forEach(function(k){
    if(!isDate(k)) return;
    if(hasRange&&(k<start||k>end)) return;
    var raw=dg[k];
    if(raw==null||raw==='') return;
    var n=Math.round(num(raw,NaN));
    if(!isFinite(n)||n<0||n>MAX_GRAMS) return;
    out[k]=n; any=true;
  });
  return any?sortKeyedMap(out):null;
}
/* 날짜 키를 항상 오름차순으로 정리 — 기기 간 서명(JSON) 비교가 흔들리지 않도록 */
function sortKeyedMap(map){
  var out={};
  Object.keys(map||{}).sort().forEach(function(k){ out[k]=map[k]; });
  return out;
}
function entryDailyGrams(e){
  if(!e) return null;
  return dailyGramsFit(e.dailyGrams, e.start, e.end);
}
/* 그 날짜에 쓸 목표 용량 (문자열). dailyGrams 가 없으면 기본 grams */
function getEntryTargetGrams(e,date){
  if(!e) return '';
  var dg=e.dailyGrams;
  if(dg&&typeof dg==='object'&&Object.prototype.hasOwnProperty.call(dg,date)){
    var v=dg[date];
    if(v!=null&&v!=='') return String(v);
  }
  return (e.grams==null?'':String(e.grams));
}
/* '45~50' → 45, '50' → 50, '' → null */
function gramsBaseNum(v){
  var t=String(v==null?'':v).split('~')[0].trim();
  if(t==='') return null;
  var n=Number(t);
  return isFinite(n)?n:null;
}
/* 날짜 키를 delta일 옮긴 새 객체 (편집 시트에서 시작일을 바꿀 때) */
function remapKeyMap(map,delta){
  var src=map||{}, out={};
  Object.keys(src).forEach(function(k){
    if(!isDate(k)) return;
    var nk=addDays(k,delta);
    if(out[nk]==null) out[nk]=src[k];
  });
  return out;
}
/* 일정이 from 이후로 delta일 움직일 때 날짜별 용량의 날짜 키도 함께 이동.
   from 이전 날짜의 값은 그 날짜에 그대로 남습니다(부분적으로 늘어난 일정). */
function shiftDailyGrams(e,from,delta){
  if(!e||!delta) return;
  var dg=dailyGramsFit(e.dailyGrams);          /* 범위 검사 전의 원본 키를 먼저 읽고 */
  if(!dg){ delete e.dailyGrams; return; }
  var out={};
  Object.keys(dg).forEach(function(k){ if(k<from) out[k]=dg[k]; });
  Object.keys(dg).forEach(function(k){
    if(k>=from){
      var nk=addDays(k,delta);
      if(out[nk]==null) out[nk]=dg[k];
    }
  });
  var fit=dailyGramsFit(out,e.start,e.end);    /* 옮긴 뒤의 범위로 정리 */
  if(fit) e.dailyGrams=fit; else delete e.dailyGrams;
}
function findStock(id){

function sumQty(list){

/* ───────── 식단 ↔ 재고 연결 (팩 미도착 경고) ─────────
   · 일정에 직접 연결한 팩(packIds)이 있으면 그것을 쓰고,
   · 없으면 이름으로 추정합니다: '루솔 한우감자미음' ↔ '루솔 한우미음'·'루솔 감자' */
var ALERT_DAYS=3;   /* 오늘부터 며칠 뒤 시작하는 식단까지 미리 확인할지 */
function coreName(name,brand){
  var s=String(name||'').replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  var parts=s.split(' ');
  if(parts.length>1) parts.shift();          /* 앞 단어(브랜드 약칭) 떼기 */
  s=parts.join('');
  if(brand&&s.indexOf(String(brand).replace(/\s+/g,''))===0) s=s.slice(String(brand).replace(/\s+/g,'').length);
  return s.replace(/(미음|죽|퓨레|이유식)$/,'');
}
function menuCore(e){
  var parts=String(e&&e.menu||'').replace(/\s+/g,' ').trim().split(' ');
  if(parts.length>1) parts.shift();
  return parts.join('');
}
function sameBrand(a,b){
  if(!a||!b) return true;
  var x=String(a).replace(/\s+/g,''), y=String(b).replace(/\s+/g,'');
  return x.indexOf(y)===0||y.indexOf(x)===0;
}
function entryStockFor(e){
  var linked=packsOf(e);
  if(linked.length) return {packs:linked, guessed:false};
  var mc=menuCore(e), out=[];
  if(!mc) return {packs:out, guessed:true};
  state.stock.forEach(function(s){
    var c=coreName(s.name,s.brand);
    if(c&&mc.indexOf(c)>=0&&sameBrand(s.brand,e.brand)) out.push(s);
  });
  return {packs:out, guessed:true};
}
/* 다가오는(또는 진행 중인) 식단 중 필요한 팩이 아직 도착 전인 것 */
function packAlerts(){
  var t=todayISO(), until=addDays(t,ALERT_DAYS), out=[];
  state.entries.forEach(function(e){
    if(e.end<t||e.start>until) return;
    var r=entryStockFor(e);
    if(!r.packs.length) return;
    var missing=r.packs.filter(function(s){
      if(s.status!=='expected') return false;
      /* 같은 재료 팩이 이미 냉장고에 있으면 괜찮음 */
      var c=coreName(s.name,s.brand);
      return !state.stock.some(function(o){
        return o!==s&&o.status==='arrived'&&o.qty>0&&coreName(o.name,o.brand)===c&&sameBrand(o.brand,s.brand);
      });
    });
    if(!missing.length) return;
    out.push({e:e, items:missing, guessed:r.guessed, startsIn:diffDays(t,e.start)});
  });
  return out;
}

/* ───────── 재료 도감 ↔ 식단·먹인 기록 연결 ───────── */
/* 반응 메모에서 확인이 필요한 증상 찾기 ('발진 없음'처럼 부정은 제외) */
var RX_WORDS=/(두드러기|발진|빨갛|붉어|붉게|설사|묽은\s?변|구토|토했|토함|게워|변비|붓기|부었|부어|기침|쌕쌕|가려|보챔|보채)/g;
var RX_CHIPS=['이상 없음','입가 발진','몸 발진','설사','구토','변비','보챔'];
function reactionFlags(text){
  var s=String(text||''), out=[], m;
  RX_WORDS.lastIndex=0;
  while((m=RX_WORDS.exec(s))){
    var after=s.slice(m.index+m[0].length, m.index+m[0].length+8);
    if(/^\s*(은|는|이|도|기|증상)?\s*(전혀\s*)?(없|x|X|안\s*보|안\s*남|안\s*생)/.test(after)) continue;
    if(out.indexOf(m[0])<0) out.push(m[0]);
  }
  return out;
}
function ingMatchesEntry(g,e){
  var n=String(g&&g.name||'').replace(/\s+/g,'');
  if(!n||!e) return false;
  return String(e.menu||'').replace(/\s+/g,'').indexOf(n)>=0||String(e.short||'').replace(/\s+/g,'').indexOf(n)>=0;
}
/* 이 재료가 들어간 식단에서 실제로 먹인 날들 (쉬어감 제외) */
function ingLogDays(g){
  var t=todayISO(), days=[];
  state.entries.forEach(function(e){
    if(!ingMatchesEntry(g,e)) return;
    var d=e.start;
    while(d<=e.end&&d<=t){
      var lg=state.logs[d];
      if(logHasEaten(lg)&&!days.some(function(x){ return x.date===d; })){
        var flags=[];
        logSlots(lg).forEach(function(x){
          if(x.slot.amount==='skip') return;
          var f=reactionFlags(x.slot.reaction);
          if(f.length) flags.push({key:x.key, text:x.slot.reaction, words:f});
        });
        days.push({date:d, e:e, flags:flags});
      }
      d=addDays(d,1);
    }
  });
  days.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
  return days;
}
/* 관찰중 재료: 첫 식단 기간(최대 3일)을 다 기록했는지 */
function ingProgress(g){
  var all=ingLogDays(g);
  var days=g.first?all.filter(function(x){ return x.date>=g.first; }):all;
  if(!days.length) days=all;
  var fe=days.length?days[0].e:null;
  if(!fe) state.entries.forEach(function(e){ if(!fe&&ingMatchesEntry(g,e)&&(!g.first||e.end>=g.first)) fe=e; });
  var need=Math.min(3, fe?diffDays(fe.start,fe.end)+1:3);
  var flagged=[];
  days.forEach(function(x){ x.flags.forEach(function(f){ flagged.push({date:x.date,key:x.key,text:f.text}); }); });
  return {count:days.length, need:need, ready:(g.status==='testing'&&days.length>=need), flagged:flagged, allFlagged:all.reduce(function(a,x){
    x.flags.forEach(function(f){ a.push({date:x.date,key:x.key,text:f.text}); }); return a; },[])};
}
/* 먹인 기록 저장 시: 미시도 재료가 들어간 식단이면 '관찰중'으로, 첫 시도일도 채움 */
function autoIngOnLog(date){
  var e=entryForDate(date);
  if(!e||!logHasEaten(state.logs[date])) return [];
  var changed=[];
  state.ingredients.forEach(function(g){
    if(!ingMatchesEntry(g,e)) return;
    if(g.status==='todo'){
      g.status='testing';
      if(!g.first||g.first>date) g.first=date;
      changed.push(g.name);
    }
  });
  return changed;
}
var ingSnooze={};   /* '나중에' 누른 통과 제안 (이번 화면에서만 숨김) */
function ingSuggestHTML(g,p,compact){

  }).join('');

/* ───────── 기록 슬롯(1식/2식) 도우미 ─────────
   기존 1식 기록 {amount,grams,reaction,shifted,at} 은 '오전' 슬롯 기록으로 그대로 읽힙니다.
   새 기록은 {am:{...}, pm:{...}, shifted, at} 형태로 저장됩니다. */
function slotObj(v){
  if(!v||typeof v!=='object') return null;
  return {
    amount:AMT_LABEL[v.amount]?v.amount:'full',
    grams:(v.grams==null||v.grams==='')?'':String(v.grams),
    reaction:v.reaction?String(v.reaction):'',
    at:v.at||null
  };
}
function normLog(v){
  if(!v||typeof v!=='object') return null;
  var two=(Object.prototype.hasOwnProperty.call(v,'am')||Object.prototype.hasOwnProperty.call(v,'pm'));
  var am=two?slotObj(v.am):slotObj(v);
  var pm=two?slotObj(v.pm):null;
  if(!am&&!pm) return null;
  return {am:am, pm:pm, shifted:v.shifted===true, at:v.at||(am&&am.at)||(pm&&pm.at)||null};
}
/* 저장된 기록 → [{key:'am'|'pm', slot:{...}}] */
function logSlots(log){
  var n=normLog(log), out=[];
  if(!n) return out;
  if(n.am) out.push({key:'am',slot:n.am});
  if(n.pm) out.push({key:'pm',slot:n.pm});
  return out;
}
function logAllSkip(log){
  var s=logSlots(log);
  if(!s.length) return false;
  return s.every(function(x){ return x.slot.amount==='skip'; });
}
function logHasEaten(log){
  return logSlots(log).some(function(x){ return x.slot.amount!=='skip'; });
}
function slotLabel(k){ return k==='pm'?'오후':'오전'; }
function mealsPerDayOf(e){ return (e&&Number(e.mealsPerDay)===2)?2:1; }
function packIdsOf(e){
  if(!e) return [];
  var ids=Array.isArray(e.packIds)?e.packIds.map(function(x){ return x==null?'':String(x); }).filter(Boolean):[];
  if(!ids.length&&e.packId) ids=[String(e.packId)];
  return ids;
}
function packsOf(e){
  return packIdsOf(e).map(findStock).filter(Boolean);
}
function packPillText(e){
  var packs=packsOf(e);
  if(!packs.length) return '';
  return packs[0].name+(packs.length>1?' 외 '+(packs.length-1)+'팩':'');
}

function cloneEntry(e){
  var pids=packIdsOf(e);
  var out={id:e.id, start:e.start, end:e.end, menu:e.menu, brand:e.brand||'',
    short:e.short||'', grams:(e.grams==null?'':String(e.grams)), note:e.note||'',
    mealsPerDay:mealsPerDayOf(e), packId:(pids[0]||null), packIds:pids};
  var dg=entryDailyGrams(e);
  if(dg) out.dailyGrams=dg;
  return out;
}
/* 저장된 먹인 기록(state.logs)의 날짜 키를 일정과 함께 이동.
   - mapFn이 같은 날짜를 돌려주면 그대로
   - 옮길 자리에 이미 다른 기록이 있으면 기록을 잃지 않도록 원래 날짜에 남김 */
function remapLogs(mapFn){
  var src=state.logs||{}, kept={}, moved=[], out={};
  Object.keys(src).forEach(function(k){
    var nk=mapFn(k);
    if(!nk||nk===k){ kept[k]=src[k]; return; }
    moved.push({from:k, to:nk, v:src[k]});
  });
  Object.keys(kept).forEach(function(k){ out[k]=kept[k]; });
  moved.forEach(function(m){
    if(!out[m.to]) out[m.to]=m.v;
    else if(!out[m.from]) out[m.from]=m.v;
  });
  state.logs=out;
}
/* rec와 날짜가 겹치는 다른 일정들 (정렬 후 앞뒤 비교) */
function overlapHits(list, recId){
  var sorted=list.slice().sort(function(a,b){ return a.start<b.start?-1:(a.start>b.start?1:0); });
  var hits=[];
  for(var i=1;i<sorted.length;i++){
    var a=sorted[i-1], b=sorted[i];
    if(b.start<=a.end){
      var other=null;
      if(a.id===recId) other=b;
      else if(b.id===recId) other=a;
      if(other&&hits.indexOf(other)<0) hits.push(other);
    }
  }
  return hits;
}
function fmtStamp(isoStr){

  return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}

/* 생후 개월수: 태어난 날부터 오늘까지 만 n개월 n일 */
function monthsAfter(fromISO, toISO){
  var a=parseISO(fromISO), b=parseISO(toISO);
  if(isNaN(a.getTime())||isNaN(b.getTime())) return '';
  var m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  var d=b.getDate()-a.getDate();
  if(d<0){
    m-=1;
    d=Math.round((b-new Date(b.getFullYear(), b.getMonth()-1, a.getDate()))/86400000);
  }
  if(m<0) return '';
  return '만 '+m+'개월'+(d>0?' '+d+'일':'');
}
/* 태어난 날 = D+0 */
function ddayText(birthISO, todayStr){
  if(!isDate(birthISO)) return '';
  var n=diffDays(birthISO, todayStr);
  var md=monthsAfter(birthISO, todayStr);
  return (n>=0?'D+'+n:'D'+n)+(md?' ('+md+')':'');
}
/* 이유식 시작일 = 1일차 */
function mealDayText(startISO, todayStr){
  if(!isDate(startISO)) return '';
  var n=diffDays(startISO, todayStr)+1;
  return n>=1?'이유식 '+n+'일차':'이유식 시작 전';
}

function logBoxHTML(log,e){

    '</div>';
  }).join('');
  return '<div class="logbox'+(logAllSkip(log)?' logbox-skip':'')+'"><div class="logbox-rows">'+rows+'</div></div>';
}

function cellHTML(dayNum, dateStr, out, t, sel){
  var e=entryForDate(dateStr);
  var log=state.logs[dateStr];
  var slots=logSlots(log);

  if(out) cls+=' out';
  if(e){ cls+=' has'; if(dateStr>t) cls+=' future'; }
  if(slots.length) cls+=' logged';
  if(slots.length&&logAllSkip(log)) cls+=' skipped';
  if(dateStr===t) cls+=' today';
  if(dateStr===sel) cls+=' sel';
  var label=e?(e.short||''):'';

    dots='<span class="cal-dots" aria-hidden="true">'+slots.map(function(x){
      return '<i'+(x.slot.amount==='skip'?' class="skip"':'')+'></i>';
    }).join('')+'</span>';
  }
  var recTxt=slots.length===2?' 기록 2끼':(slots.length?' 기록 1끼':'');
  return '<button class="'+cls+'" data-act="sel-date" data-date="'+dateStr+'" aria-label="'+mdLong(dateStr)+recTxt+'">'+
    '<span class="cal-d">'+dayNum+'</span>'+

/* 달력 칸 이름: 4글자까지는 한 줄, 더 길면 두 줄로 나눠 보여줘요.
   재료 이름 경계에서 나누고('한우고구마' → 한우 / 고구마), 못 찾으면 가운데에서 나눠요. */
var CAL_ONE_LINE=4;
function calLabelLines(label){
  var t=String(label||'').replace(/\s+/g,'');
  if(t.length<=CAL_ONE_LINE) return [t];
  var names=state.ingredients.map(function(g){ return String(g.name||'').replace(/\s+/g,''); })
    .filter(function(n){ return n&&n.length<t.length; })
    .sort(function(a,b){ return b.length-a.length; });
  for(var i=0;i<names.length;i++){
    if(t.indexOf(names[i])===0) return [names[i], t.slice(names[i].length)];
  }
  for(i=0;i<names.length;i++){
    var k=t.length-names[i].length;
    if(k>0&&t.slice(k)===names[i]) return [t.slice(0,k), names[i]];
  }
  var half=Math.ceil(t.length/2);
  return [t.slice(0,half), t.slice(half)];
}
function calLabelHTML(label){
  if(!label) return '<span class="cal-l">&nbsp;</span>';
  var lines=calLabelLines(label);
  if(lines.length===1) return '<span class="cal-l">'+esc(lines[0])+'</span>';
  return '<span class="cal-l two"><span>'+esc(lines[0])+'</span><span>'+esc(lines[1])+'</span></span>';
}

function calendarHTML(){
  var t=todayISO();
  var sel=state.ui.sel;
  var mk=state.ui.calMonth||monthKey(sel);
  var y=Number(mk.slice(0,4)), m=Number(mk.slice(5,7));
  var startPad=new Date(y, m-1, 1).getDay();
  var daysIn=new Date(y, m, 0).getDate();
  var prevDays=new Date(y, m-1, 0).getDate();
  var cells=[], i;
  for(i=startPad-1;i>=0;i--){
    var pd=prevDays-i;
    cells.push(cellHTML(pd, iso(new Date(y, m-2, pd)), true, t, sel));
  }
  for(i=1;i<=daysIn;i++){
    cells.push(cellHTML(i, iso(new Date(y, m-1, i)), false, t, sel));
  }
  var tail=(7-(cells.length%7))%7;
  for(i=1;i<=tail;i++){
    cells.push(cellHTML(i, iso(new Date(y, m, i)), true, t, sel));
  }
  return '<div class="cal">'+
    '<div class="cal-head">'+
      '<div class="cal-title">'+y+'년 '+m+'월</div>'+
      '<div class="cal-nav">'+
        '<button class="daynav" data-act="cal-shift" data-n="-1" aria-label="이전 달">‹</button>'+
        '<button class="daynav" data-act="cal-shift" data-n="1" aria-label="다음 달">›</button>'+
      '</div>'+
    '</div>'+
    '<div class="cal-dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>'+
    '<div class="cal-grid">'+cells.join('')+'</div>'+
    '<div class="cal-legend">'+
      '<span><i style="background:#FBE0CE"></i>지난 식단</span>'+
      '<span><i style="background:#FFD9C6"></i>예정</span>'+
      '<span><i style="background:#F28A70"></i>기록 완료</span>'+
      '<span><i style="background:#B9AC9E"></i>쉬어감</span>'+
    '</div>'+
    '<div class="cal-legend" style="margin-top:3px;color:#C6B8A9;font-size:10px">점 2개 = 오전·오후 두 끼 기록</div>'+
  '</div>';
}

function listHTML(){
  var t=todayISO();
  var sel=state.ui.sel;
  var list=state.entries.slice().sort(function(a,b){ return a.start<b.start?-1:(a.start>b.start?1:0); });
  var html='<div class="sec-head"><span class="sec-title">전체 식단</span><span class="sec-sub">'+list.length+'개 일정</span></div>';
  if(!list.length){
    html+='<div class="card" style="color:#8B8574;font-size:12.5px;text-align:center">아직 식단이 없어요.</div>';
  } else {
    var rowOf=function(e){
      var days=diffDays(e.start,e.end)+1;
      var badge;
      if(t>e.end) badge='<span class="badge badge-muted">지난 일정</span>';
      else if(t<e.start) badge='<span class="badge badge-peach">예정</span>';
      else badge='<span class="badge badge-done">진행중</span>';
      var active=(sel>=e.start&&sel<=e.end);
      var skips=0;
      for(var d=e.start; d<=e.end; d=addDays(d,1)){
        if(logAllSkip(state.logs[d])) skips++;
      }
      return '<div class="row'+(active?' row-active':'')+'" data-act="sel-date" data-date="'+(active?sel:e.start)+'">'+
        '<div class="row-main">'+
          '<div class="row-title">'+esc(e.menu)+'</div>'+
          '<div class="row-sub">'+mdShort(e.start)+' ~ '+mdShort(e.end)+' · '+days+'일 · '+esc(e.grams)+'g'+(entryDailyGrams(e)?' · 날짜별 용량':'')+(mealsPerDayOf(e)===2?' · 하루 2회':'')+(packsOf(e).length?' · 🔗 연결 '+packsOf(e).length+'팩':'')+(skips?' · 쉬어감 '+skips+'일':'')+'</div>'+
          (e.note?'<div class="row-sub muted">'+esc(e.note)+'</div>':'')+
        '</div>'+
        '<div class="row-side">'+badge+'<button class="mini" data-act="entry-edit" data-id="'+e.id+'">수정</button></div>'+
      '</div>';
    };
    /* 지난 일정은 위에 접어 두고, 진행 중·예정 일정만 바로 보여줘요 */
    var past=list.filter(function(e){ return e.end<t; });
    var rest=list.filter(function(e){ return e.end>=t; });
    if(past.length){
      var pastActive=past.some(function(e){ return sel>=e.start&&sel<=e.end; });
      html+='<details class="fold"'+(pastActive?' open':'')+'><summary>🗂 지난 식단 '+past.length+'개 <span class="chev">▾</span></summary>'+
        past.map(rowOf).join('')+'</details>';
    }
    html+=rest.length?rest.map(rowOf).join(''):'<div class="card" style="color:#8B8574;font-size:12.5px;text-align:center">앞으로 예정된 식단이 없어요.</div>';
  }
  var skipDays=Object.keys(state.logs).filter(function(k){
    return logAllSkip(state.logs[k]);
  }).sort().reverse();
  if(skipDays.length){
    html+='<div class="sec-head"><span class="sec-title">쉬어간 날</span><span class="sec-sub">'+skipDays.length+'일</span></div>';
    html+=skipDays.map(function(d){
      var lg=state.logs[d]||{};
      var memo=logSlots(lg).map(function(x){ return x.slot.reaction||''; }).filter(Boolean).join(' / ');
      return '<div class="row row-skip" data-act="sel-date" data-date="'+d+'">'+
        '<div class="row-main">'+
          '<div class="row-title">'+mdLong(d)+' '+dowOf(d)+' <span class="badge badge-skip">쉬어감</span></div>'+
          '<div class="row-sub muted">'+(memo?esc(memo):'이날은 이유식을 쉬었어요')+(lg.shifted?' · 이후 일정 하루 미룸':'')+'</div>'+
        '</div>'+
      '</div>';
    }).join('');
  }
  html+='<button class="btn btn-ghost btn-block" style="margin-top:6px" data-act="entry-new">＋ 새 식단 일정</button>';
  return html;
}

}

function itemHTML(s){

    else sub='도착 예정';
  } else {
    sub='도착 '+mdShort(s.arrived||t)+' · 냉장 '+(s.shelfLife||3)+'일';
    if(s.opened) sub+=' · 개봉 '+mdShort(s.opened);
  }
  if(s.expiryDate) sub+=' · 유통기한 '+mdShort(s.expiryDate);
  var expChip='';
  if(s.status==='expected'&&s.expected){
    if(s.expected<t) expChip='<div style="margin-top:6px"><span class="badge badge-warn">도착 확인 필요 · '+diffDays(s.expected,t)+'일 지남</span></div>';
    else if(s.expected===t) expChip='<div style="margin-top:6px"><span class="badge badge-soon">📦 오늘 도착</span></div>';
    else if(diffDays(t,s.expected)===1) expChip='<div style="margin-top:6px"><span class="badge badge-muted">내일 도착</span></div>';
  }
  if(s.expiryDate&&s.qty>0&&s.status==='arrived'&&!s.opened){
    var leftE=diffDays(t,s.expiryDate);
    if(leftE<0) expChip='<div style="margin-top:6px"><span class="badge badge-warn">유통기한 지남</span></div>';
    else if(leftE<=3) expChip='<div style="margin-top:6px"><span class="badge badge-soon">유통기한 D-'+leftE+'</span></div>';
  }
  var tools='';
  if(s.status==='expected'){
    tools+='<button class="mini mini-primary" data-act="stock-arrive" data-id="'+s.id+'">도착 처리</button>';
  } else if(s.opened){
    tools+='<button class="mini" data-act="stock-unopen" data-id="'+s.id+'">개봉 취소</button>';
  } else if(s.qty>0){
    tools+='<button class="mini mini-primary" data-act="stock-open" data-id="'+s.id+'">개봉일 기록</button>';
  }
  tools+='<button class="mini" data-act="stock-edit" data-id="'+s.id+'">수정</button>';

  var links=stockLinkBadges(s);
  return '<div class="item">'+
    '<div class="item-top">'+
      '<div style="flex:1;min-width:0">'+
        '<div class="item-name">'+esc(s.name)+'<span class="tag">'+s.size+'g</span></div>'+
        '<div class="item-sub">'+(s.brand?esc(s.brand)+' · ':'')+sub+'</div>'+
        expChip+links+
        (s.note?'<div class="item-note">'+esc(s.note)+'</div>':'')+
      '</div>'+
      '<div class="stepper">'+
        '<button data-act="stock-dec" data-id="'+s.id+'"'+(s.qty<=0?' disabled':'')+' aria-label="한 팩 줄이기">−</button>'+
        '<span class="qty">'+s.qty+'</span>'+
        '<button data-act="stock-inc" data-id="'+s.id+'" aria-label="한 팩 늘리기">+</button>'+
      '</div>'+
    '</div>'+
    '<div class="item-tools">'+tools+'</div>'+
  '</div>';
}

function renderStock(){
  var t=todayISO();
  var opened=state.stock.filter(function(s){ return !!s.opened&&s.qty>0; });
  var warn='<div class="sec-head"><span class="sec-title">개봉 중 · D-day</span><span class="sec-sub">개봉일 포함 3일 안에</span></div>';
  if(!opened.length){
    warn+='<div class="card" style="color:#8B8574;font-size:12.5px;line-height:1.5">지금 개봉 중인 팩이 없어요.<br>팩을 뜯으면 <b>개봉일 기록</b>을 눌러 D-day를 켜 두세요.</div>';
  } else {
    warn+=opened.map(function(s){
      var life=Math.max(1,s.shelfLife||3);
      /* 개봉한 날을 1일째로 계산: 11/17 개봉 · 3일 → 11/19까지 */
      var openedDeadline=addDays(s.opened,life-1);
      var exp=(s.expiryDate&&isDate(s.expiryDate))?s.expiryDate:'';
      var byExpiry=!!(exp&&exp<openedDeadline);
      var limit=byExpiry?exp:openedDeadline;
      var left=diffDays(t,limit);
      var cls=left<0?'over':(left<=1?'urgent':(left<=2?'warn':''));
      var lab=left<0?'기한 지남':(left===0?'오늘까지':'D-'+left);
      var span=Math.max(1,diffDays(s.opened,limit));
      var used=Math.min(1,Math.max(0,diffDays(s.opened,t)/span));
      return '<div class="dday '+cls+'">'+
        '<div class="dday-main">'+
          '<div class="dday-name">'+esc(s.name)+'<span class="tag">'+s.size+'g</span></div>'+
          '<div class="dday-sub">개봉 '+mdShort(s.opened)+' · '+mdShort(limit)+'까지'+(byExpiry?' · 유통기한 기준':'')+'</div>'+
          '<div class="bar"><i style="width:'+Math.round(used*100)+'%"></i></div>'+
        '</div>'+
        '<div class="dday-side">'+
          '<div class="dday-lab">'+lab+'</div>'+
          '<button class="mini mini-primary" data-act="stock-finish" data-id="'+s.id+'">다 먹었어요</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }

  var arrived=state.stock.filter(function(s){ return s.status==='arrived'; });
  var expected=state.stock.filter(function(s){ return s.status==='expected'; })
    .sort(function(a,b){ return String(a.expected).localeCompare(String(b.expected)); });

  var html=warn;
  html+='<div class="sec-head"><span class="sec-title">보유 · 냉장고</span><span class="sec-sub">'+sumQty(arrived)+'팩</span></div>';
  /* 다 먹은 팩(0팩·개봉 안 함)은 아래에 접어 둬요 */
  var inFridge=arrived.filter(function(s){ return s.qty>0||!!s.opened; });
  var emptied=arrived.filter(function(s){ return !(s.qty>0||!!s.opened); });
  html+=inFridge.length?inFridge.map(itemHTML).join(''):'<div class="card" style="color:#8B8574;font-size:12.5px">보유 중인 팩이 없어요.</div>';
  if(emptied.length){
    html+='<details class="fold"><summary>🗂 다 먹은 팩 '+emptied.length+'개 <span class="chev">▾</span></summary>'+
      '<p class="fold-note">수량을 + 로 늘리면 다시 냉장고 목록으로 올라가요.</p>'+
      emptied.map(itemHTML).join('')+'</details>';
  }
  html+='<div class="sec-head"><span class="sec-title">도착 예정</span><span class="sec-sub">'+sumQty(expected)+'팩</span></div>';
  html+=expected.length?expected.map(itemHTML).join(''):'<div class="card" style="color:#8B8574;font-size:12.5px">도착 예정인 팩이 없어요.</div>';
  html+='<button class="btn btn-ghost btn-block" style="margin-top:6px" data-act="stock-new">＋ 품목 추가</button>';
  var pa=packAlertsHTML();
  $('#stockWarnMount').innerHTML=pa?'<div class="sec-head"><span class="sec-title">곧 먹을 식단 · 팩 확인</span><span class="sec-sub">'+ALERT_DAYS+'일 안</span></div>'+pa:'';
  $('#stockMount').innerHTML=html;
}

/* 재료 카드 아래: 관찰 진행도 · 통과 제안 · 반응 메모 모아보기 */
function ingExtraHTML(g){
  var p=ingProgress(g), html='';

    var pct=Math.round(Math.min(1,p.count/Math.max(1,p.need))*100);
    html+='<div class="ing-prog"><span>관찰 기록 '+Math.min(p.count,p.need)+'/'+p.need+'일</span><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
    html+=ingSuggestHTML(g,p,false);
  }
  if(p.allFlagged.length&&!(g.status==='testing'&&p.flagged.length)){
    html+='<ul class="ing-rx">'+p.allFlagged.slice(-3).map(function(f){
      return '<li><span>'+mdShort(f.date)+' '+slotLabel(f.key)+'</span>'+esc(f.text)+'</li>';
    }).join('')+'</ul>';
  }
  return html;
}

function renderIng(){

  state.ingredients.forEach(function(g){ counts[g.status]=(counts[g.status]||0)+1; });
  var stats='<div class="stats">'+
    '<div class="stat done"><b>'+counts.done+'</b><span>통과</span></div>'+
    '<div class="stat testing"><b>'+counts.testing+'</b><span>관찰중</span></div>'+
    '<div class="stat caution"><b>'+counts.caution+'</b><span>주의</span></div>'+
    '<div class="stat todo"><b>'+counts.todo+'</b><span>미시도</span></div>'+
  '</div>';

/* ───────── 시트(모달) ───────── */
/* ── 뒤로가기(안드로이드 버튼·iOS 스와이프)로 시트 닫기 ──
   시트를 열 때 방문 기록을 하나 쌓고, 뒤로가기가 오면 앱을 떠나는 대신 시트만 닫아요. */
var sheetHist=false, ignorePop=false;
function pushSheetHist(){
  if(sheetHist||ignorePop) return;
  try{ history.pushState({ybSheet:1},''); sheetHist=true; }catch(e){}
}
function popSheetHist(){
  if(!sheetHist) return;
  sheetHist=false;
  try{ ignorePop=true; history.back(); }catch(e){ ignorePop=false; }
}
window.addEventListener('popstate', function(){
  if(ignorePop){
    ignorePop=false;
    /* 닫자마자 다른 시트를 연 경우: 그 시트용 기록을 다시 쌓음 */
    if(sheetIsOpen()&&!sheetHist) pushSheetHist();
    return;
  }
  sheetHist=false;
  if(!sheetIsOpen()) return;
  if(sync.pendingRef) cancelConnect(false);
  else closeSheet();
});

function openSheet(opts){
  pushSheetHist();
  var el=document.getElementById('sheet');
  el.innerHTML='<div class="sheet-wrap">'+
    '<div class="sheet-backdrop" data-act="close-sheet"></div>'+
    '<div class="sheet-panel" role="dialog" aria-modal="true">'+
      '<div class="sheet-grip"></div>'+
      '<div class="sheet-head"><h3>'+esc(opts.title)+'</h3>'+
        '<button class="icon-btn" data-act="close-sheet" aria-label="닫기">✕</button></div>'+
      opts.body+
    '</div>'+
  '</div>';
  el.classList.add('open');
  lockScroll();
  if(opts.onMount) opts.onMount(el);
}
function closeSheet(){
  var el=document.getElementById('sheet');
  el.classList.remove('open');
  el.innerHTML='';
  unlockScroll();
  popSheetHist();
}
function lockScroll(){
  var b=document.body;
  if(!b||b.classList.contains('sheet-open')) return;
  sheetScrollY=window.pageYOffset||document.documentElement.scrollTop||0;
  b.style.top=(-sheetScrollY)+'px';
  b.classList.add('sheet-open');
}
function unlockScroll(){
  var b=document.body;
  if(!b||!b.classList.contains('sheet-open')) return;
  b.classList.remove('sheet-open');
  b.style.top='';
  try{ window.scrollTo(0,sheetScrollY); }catch(e){}
}
function confirmDo(title,msg,label,fn){
  openSheet({
    title:title,
    body:'<p class="sheet-note">'+esc(msg)+'</p>'+
      '<div class="sheet-actions">'+
        '<button type="button" class="btn btn-ghost" data-act="close-sheet">취소</button>'+
        '<button type="button" class="btn btn-danger" id="confirmYes">'+esc(label)+'</button>'+
      '</div>',
    onMount:function(root){
      root.querySelector('#confirmYes').addEventListener('click', function(){
        closeSheet(); fn();
      });
    }
  });
}

function syncAmtSkip(root){
  var scope=root||document;
  var seg=scope.querySelector('#amtSeg');
  var g=scope.querySelector('#fGrams');
  if(!seg||!g) return;
  var on=seg.querySelector('.on');
  var isSkip=!!(on&&on.getAttribute('data-amt')==='skip');
  var extra=scope.querySelector('#skipExtra');
  if(isSkip){
    if(g.getAttribute('data-prev')===null) g.setAttribute('data-prev', g.value||'');
    g.value='0';
    g.disabled=true;
    g.style.opacity='.5';
    if(extra) extra.classList.remove('hidden');
  } else {
    g.disabled=false;
    g.style.opacity='';
    var prev=g.getAttribute('data-prev');
    if(prev!==null){
      /* 쉬어감에서 되돌아올 때 data-prev가 0이거나 비어 있으면 계획량을 기본값으로 복원 */
      var dflt=g.getAttribute('data-def')||'';
      var pv=String(prev).trim();
      g.value=(pv===''||Number(pv)===0)?dflt:prev;
      g.removeAttribute('data-prev');
    }
    if(extra) extra.classList.add('hidden');
  }
  /* 쉬어감으로 미뤘던 날을 다른 상태로 고칠 때만 '되돌리기' 선택지를 보여줌 */
  var unWrap=scope.querySelector('#unshiftExtra');
  if(unWrap){
    var wasShifted=(g.getAttribute('data-shifted')==='1');
    unWrap.classList.toggle('hidden', !(wasShifted&&!isSkip));
  }
}

/* 쉬어간 날 이후 일정(과 먹인 기록)을 하루씩 뒤로 밀기 */
function shiftScheduleFrom(date){
  var moved=0;
  state.entries.forEach(function(e){
    if(e.start===date){
      e.start=addDays(e.start,1); e.end=addDays(e.end,1); shiftDailyGrams(e,date,1); moved++;
    } else if(e.start<date&&e.end>=date){
      e.end=addDays(e.end,1); shiftDailyGrams(e,date,1); moved++;
    } else if(e.start>date){
      e.start=addDays(e.start,1); e.end=addDays(e.end,1); shiftDailyGrams(e,date,1); moved++;
    }
  });
  state.entries.sort(function(a,b){ return a.start<b.start?-1:(a.start>b.start?1:0); });
  /* 기준일(date)의 쉬어감 기록은 그대로 두고, 그 이후 기록만 따라 이동 */
  remapLogs(function(k){ return k>date?addDays(k,1):k; });
  return moved;
}
/* shiftScheduleFrom으로 밀었던 일정(과 먹인 기록)을 하루 앞으로 되돌리기 */
function unshiftScheduleFrom(date){
  var next=addDays(date,1), moved=0;
  state.entries.forEach(function(e){
    if(e.start===next){
      e.start=addDays(e.start,-1); e.end=addDays(e.end,-1); shiftDailyGrams(e,next,-1); moved++;
    } else if(e.start<date&&e.end>=next){
      e.end=addDays(e.end,-1); shiftDailyGrams(e,next,-1); moved++;
    } else if(e.start>next){
      e.start=addDays(e.start,-1); e.end=addDays(e.end,-1); shiftDailyGrams(e,next,-1); moved++;
    }
  });
  state.entries.sort(function(a,b){ return a.start<b.start?-1:(a.start>b.start?1:0); });
  remapLogs(function(k){ return k>date?addDays(k,-1):k; });
  return moved;
}

/* 반응 빠른 선택: 누르면 메모에 넣고, 다시 누르면 빼요 */
function rxHas(text,chip){ return String(text||'').split(/\s*[,·\/\n]\s*/).indexOf(chip)>=0; }
function rxChipsHTML(text){
  return RX_CHIPS.map(function(c){
    var on=rxHas(text,c);
    return '<button type="button" data-rx="'+esc(c)+'" class="'+(on?'on':'')+(c==='이상 없음'?' ok':'')+'">'+esc(c)+'</button>';
  }).join('');
}
function rxToggle(text,chip){
  var parts=String(text||'').split(/\s*,\s*/).map(function(x){ return x.trim(); }).filter(Boolean);
  var i=parts.indexOf(chip);
  if(i>=0) parts.splice(i,1);
  else{
    if(chip==='이상 없음') parts=parts.filter(function(x){ return RX_CHIPS.indexOf(x)<0; });
    else parts=parts.filter(function(x){ return x!=='이상 없음'; });
    var nChips=0;
    while(nChips<parts.length&&RX_CHIPS.indexOf(parts[nChips])>=0) nChips++;
    parts.splice(nChips,0,chip);   /* 빠른 선택 항목은 앞쪽에 모아요 */
  }
  return parts.join(', ');
}
